# Python static analysis for the whole repository. Scoped to pyflakes (F) and
# syntax errors (E9) only -- correctness signals (unused imports/variables,
# undefined names, shadowed builtins), not opinionated style. This repo has no
# prior Python style tooling; widening beyond F/E9 is a separate decision, not a
# lint-drift side effect.
#
# The scope is the repository, not scripts/: the per-skill scripts/ trees
# (pr-review/, incident-rca/, domain-comprehension/, ...) are the Python that
# actually ships to users, and they were the half that had no static analysis at
# all.
target-version = "py312"

# Nothing here is first-party source under active review:
#   generated/       - regenerated by `make generate`; fix the generator, not the output
#   .claude/         - agent scratch space, including concurrent worktrees of this repo
#   dist/            - release bundles produced by scripts/package_release.py
#   .git/            - not source
exclude = [
    ".claude",
    ".git",
    "dist",
    "generated",
]

[lint]
select = ["F", "E9"]
