# SKILL.md frontmatter schema (v1)
#
# Machine-readable platform facts belong in skills.yaml — not duplicated here.
# This schema validates agent-discovery frontmatter only.

schema_version: 1

allowed_keys:
  - name
  - description
  - disable-model-invocation
  - status
  - deprecated
  - deprecation

required_keys:
  - name
  - description

rules:
  disable-model-invocation:
    type: boolean
    description: Must be true when skills.yaml invocation is automation-only

