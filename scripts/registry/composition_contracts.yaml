# Composition contracts for cross-skill graph validation (#19 v2).
# Artifact types are shared handoff envelopes; write_authority is the maximum external write surface.

artifact_types:
  - mr_context
  - mr_review_report
  - rca_report
  - k8s_rightsizing_report
  - squad_map
  - ownership_lookup
  - migration_status_rollup
  - cost_sweep_rollup
  - implementation_task
  - implementation_pr
  - digest_report
  - test_suite

# Field-level contracts for producer/consumer schema matching (#19 v2 follow-up).
artifact_schemas:
  mr_context:
    fields: [project, merge_request_iid, head_sha, posting_policy]
  mr_review_report:
    fields: [review_metadata, posted, head_sha, posting_mode]
  rca_report:
    fields: [assessment_metadata, root_cause, confidence]
  k8s_rightsizing_report:
    fields: [assessment_metadata, recommendations]
  squad_map:
    fields: [squads, generated_at]
  ownership_lookup:
    fields: [query, squad, confidence]
  migration_status_rollup:
    fields: [items, generated_at, source_revision]
  cost_sweep_rollup:
    fields: [items, generated_at, source_revision]
  implementation_task:
    fields: [task_id, scope, acceptance_criteria]
  implementation_pr:
    fields: [pr_url, head_sha, task_id]
  digest_report:
    fields: [sections, generated_at, source_revisions]
  test_suite:
    fields: [tests, framework, target_path]

write_authority_levels:
  read-only: 0
  comment: 1
  repository-write: 2
  automation-unattended: 3

skills:
  pr-review:
    produces: [mr_review_report]
    consumes: [mr_context]
    produce_fields:
      mr_review_report: [review_metadata, posted, head_sha, posting_mode]
    consume_fields:
      mr_context: [project, merge_request_iid, head_sha]
    write_authority: comment

  pr-gatekeeper:
    produces: [mr_review_report]
    consumes: [mr_context]
    produce_fields:
      mr_review_report: [review_metadata, posted, head_sha]
    consume_fields:
      mr_context: [project, merge_request_iid, head_sha]
    write_authority: comment

  k8s-overprovisioning-datadog:
    produces: [k8s_rightsizing_report]
    consumes: [mr_context]
    write_authority: read-only

  incident-rca:
    produces: [rca_report]
    consumes: [mr_context]
    write_authority: read-only

  incident-triage-agent:
    produces: [rca_report, ownership_lookup]
    consumes: [mr_context]
    produce_fields:
      rca_report: [assessment_metadata, root_cause, confidence]
      ownership_lookup: [query, squad, confidence]
    consume_fields:
      mr_context: [project, head_sha]
    write_authority: read-only

  domain-comprehension:
    produces: [squad_map]
    consumes: [mr_context]
    write_authority: read-only

  squad-map:
    produces: [squad_map, ownership_lookup]
    consumes: [mr_context]
    write_authority: read-only

  who-owns-x-bot:
    produces: [ownership_lookup]
    consumes: [mr_context]
    write_authority: read-only

  new-hire-guide:
    produces: [digest_report]
    consumes: [mr_context]
    write_authority: read-only

  release-readiness-checker:
    produces: [digest_report]
    consumes: [mr_context, mr_review_report, k8s_rightsizing_report, rca_report]
    produce_fields:
      digest_report: [sections, generated_at, source_revisions]
    consume_fields:
      mr_context: [project, head_sha]
      mr_review_report: [review_metadata, posted]
      k8s_rightsizing_report: [assessment_metadata, recommendations]
      rca_report: [assessment_metadata, root_cause, confidence]
    write_authority: read-only

  migration-program-manager:
    produces: [migration_status_rollup]
    consumes: []
    produce_fields:
      migration_status_rollup: [items, generated_at, source_revision]
    write_authority: read-only

  cost-optimization-sprint-planner:
    produces: [cost_sweep_rollup]
    consumes: []
    produce_fields:
      cost_sweep_rollup: [items, generated_at, source_revision]
    write_authority: read-only

  mysql-to-postgres-sql:
    produces: [implementation_pr]
    consumes: [implementation_task]
    write_authority: repository-write

  loop-task-implementer:
    produces: [implementation_pr]
    consumes: [implementation_task]
    write_authority: repository-write

  backlog-runner:
    produces: [implementation_pr]
    consumes: [implementation_task]
    write_authority: read-only

  weekly-squad-digest:
    produces: [digest_report]
    consumes: [migration_status_rollup, cost_sweep_rollup]
    produce_fields:
      digest_report: [sections, generated_at, source_revisions]
    consume_fields:
      migration_status_rollup: [items, generated_at, source_revision]
      cost_sweep_rollup: [items, generated_at, source_revision]
    write_authority: read-only

  unit-test-creator:
    produces: [test_suite]
    consumes: [implementation_task]
    write_authority: repository-write

  integration-test-creator:
    produces: [test_suite]
    consumes: [implementation_task]
    write_authority: repository-write

  contract-test-creator:
    produces: [test_suite]
    consumes: [implementation_task]
    write_authority: repository-write

  e2e-test-creator:
    produces: [test_suite]
    consumes: [implementation_task]
    write_authority: repository-write

  api-test-creator:
    produces: [test_suite]
    consumes: [implementation_task]
    write_authority: repository-write

  test-writer:
    produces: [test_suite]
    consumes: [implementation_task]
    write_authority: read-only
