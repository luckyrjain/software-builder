creator_parity:
  skills:
  - unit-test-creator
  - integration-test-creator
  - contract-test-creator
  - e2e-test-creator
  - api-test-creator
  forwarded_fields:
  - request
  - repo_root
  - target
  - test_framework_hint
  - run_tests
  - max_files_per_run
  - deadline
  - session_token_budget
  - output_dir
  - specialist_inputs
  framework_owned_fields:
  - execution_context
  child_authority: skill_result
  degraded_status: BLOCKED
  interactive_gate_policy: specialist-only
  router_gate_policy: classification-only
  output_contract:
    artifact: test_suite
    fields:
    - tests
    - framework
    - target_path
