    - project
    - merge_request_iid
    - head_sha
    - posting_policy
    - review_mode
    - audit_type
    - expected_head_sha
  mr_review_report:
    fields:
    - review_metadata
    - posted
    - head_sha
    - posting_mode
  rca_report:
    fields:
    - assessment_metadata
    - root_cause
    - confidence
  k8s_rightsizing_report:
    fields:
    - assessment_metadata
    - recommendations
  squad_map:
    fields:
    - squads
    - generated_at
  ownership_lookup:
    fields:
    - query
    - squad
    - confidence
  migration_status_rollup:
    fields:
    - items
    - generated_at
    - source_revision
  cost_sweep_rollup:
    fields:
    - items
    - generated_at
    - source_revision
  implementation_task:
    fields:
    - task_id
    - scope
    - acceptance_criteria
    - request
    - repo_root
    - target
    - level_hint
    - specialist_inputs
    - test_framework_hint
    - run_tests
    - max_files_per_run
    - deadline
    - session_token_budget
    - output_dir
  implementation_pr:
    fields:
    - pr_url
    - head_sha
    - task_id
  digest_report:
    fields:
    - sections
    - generated_at
    - source_revisions
  test_suite:
    fields:
    - tests
    - framework
    - target_path
  test_orchestration_result:
    fields:
    - test_plan
    - orchestration_status
    - unfinished_levels
    - level_reports
  prd_report:
    fields:
    - title
    - build_readiness
    - depth
    - response_mode
  architecture_review_report:
    fields:
    - title
    - architecture_decision
    - risk_tier
    - confidence
  system_design_spec:
    fields:
