weekly-squad-digest:
  path: weekly-squad-digest
  category: migration
  invocation: automation-only
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires:
    - migration-program-manager
    - cost-optimization-sprint-planner
  composition:
    mode: aggregate
    escalation_targets:
    - migration-program-manager
    - cost-optimization-sprint-planner
    consumes:
    - migration_status_rollup
    - cost_sweep_rollup
    consume_fields:
      migration_status_rollup:
      - items
      - generated_at
      - source_revision
      cost_sweep_rollup:
      - items
      - generated_at
      - source_revision
  capabilities:
    required:
    - scheduler.cron.trigger
    optional:
    - name: slack.post.message
      enables: scheduled digest delivery
    degraded_modes:
      slack.post.message: WEEKLY_SQUAD_DIGEST.md is still written; the digest simply
        is not delivered via Slack
  lint:
    skill_md_max_lines: 180
    target: weekly-squad-digest
  risk_class:
  - unattended
  version: 1.0.0
  type: trigger
  authority: read-only
  permissions:
    repository: read
    external_actions: write
    unattended: true
    merge: false
  output_contract:
    produces:
    - digest_report
    produce_fields:
      digest_report:
      - sections
      - generated_at
      - source_revisions
  dependencies:
  - migration-program-manager
  - cost-optimization-sprint-planner
  version_source: skill_frontmatter_legacy_numeric
  degraded_behavior:
    missing_capability: scheduler.cron.trigger
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: None (reads rollup JSON artifacts)
  routing:
    patterns:
    - \bweekly\b.*\b(squad|team)\b.*\b(digest|summary|rollup)\b
