resilience-review:
  path: resilience-review
  category: review
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    invokes: []
    escalation_targets: []
    consumes:
    - assessment_context
    consume_fields:
      assessment_context:
      - assessment_target
      - inputs
      - input_provenance
      - evidence_refs
      - unresolved
  capabilities:
    required:
    - host.report.write
    optional:
    - name: host.repository.read
      enables: repository and runtime/config evidence discovery
  lint:
    skill_md_max_lines: 180
    target: resilience-review
  version: 1.0.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - resilience_review_report
    produce_fields:
      resilience_review_report:
      - title
      - verdict
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies: []
  degraded_behavior:
    missing_capability: host.repository.read
    available_capabilities:
    - host.report.write
    behavior: DEGRADED
  setup_freshness:
    external_services: None — reads supplied resilience content and optional repository
      or runtime/config evidence only
  routing:
    patterns:
    - \b(resilience|failure[- ]mode|fault[- ]toleran)\w*\b.*\b(review|assessment|analysis|controls?)\b
    - \b(timeout budgets?|retry polic(?:y|ies)|circuit breakers?|load shedding|backpressure|queue
      handling|idempotency|partial failures?|recovery reconciliation)\b
    exclude_patterns:
    - \b(incident|outage|postmortem|root cause|RCA)\b
    - \b(capacity|headroom|forecast|sizing)\b
