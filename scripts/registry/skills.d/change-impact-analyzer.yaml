change-impact-analyzer:
  path: change-impact-analyzer
  category: analysis
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    invokes: []
    escalation_targets: []
    consumes:
    - mr_context
    - assessment_context
    consume_fields:
      mr_context:
      - project
      - merge_request_iid
      - head_sha
      assessment_context:
      - assessment_target
      - inputs
      - input_provenance
      - evidence_refs
      - unresolved
  capabilities:
    required:
    - host.report.write
    optional:
    - name: host.repository.read
      enables: repository-grounded diff/caller/consumer/config discovery
    - name: host.scm.change.read
      enables: exact-head remote PR/MR metadata + diff retrieval
  lint:
    skill_md_max_lines: 180
    target: change-impact-analyzer
  version: 1.0.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - change_impact_report
    produce_fields:
      change_impact_report:
      - title
      - assessment_target
      - coverage_status
      - material_unknowns
      - impacted_repositories
      - criticality
      - change_classes
      - impacted_services
      - impacted_contracts
      - impacted_data
      - impacted_dependencies
      - impacted_owners
      - required_tests
      - operational_impacts
      - review_triggers
      - unknowns
      - evidence_refs
  dependencies: []
  degraded_behavior:
    missing_capability: host.repository.read
    available_capabilities:
    - host.report.write
    - host.scm.change.read
    behavior: DEGRADED
  setup_freshness:
    external_services: None — reads supplied design/change content and optional repository
      or exact-head SCM evidence only
  routing:
    patterns:
    - \b(change impact|impact analysis|affected surface)\b
    - \bwhat does this change touch\b
    - \bwhat\b.*\b(services?|contracts?|data|tests?)\b.*\b(change|affected|impact|touch)\b
    - \b(services?|contracts?|data|tests?)\b.*\b(affected|impact|change|touch)\b.*\b(PR|MR|pull
      request|merge request|design|proposal|change)\b
    - \b(PR|MR|pull request|merge request)\s*[#!]?\d+\b.*\b(services?|contracts?|data|tests?|dependencies?)\b.*\b(affected|impact|change|touch)\b
    exclude_patterns:
    - \b(review|regression|correctness|blast radius|rollback risk|deployment risk|release
      risk)\b
