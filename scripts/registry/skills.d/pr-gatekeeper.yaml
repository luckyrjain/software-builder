pr-gatekeeper:
  path: skills/pr-gatekeeper
  category: review
  invocation: automation-only
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires:
    - pr-review
  composition:
    invokes:
    - pr-review
    escalation_targets:
    - pr-review
    consumes:
    - mr_context
    consume_fields:
      mr_context:
      - project
      - merge_request_iid
      - head_sha
      - expected_head_sha
  capabilities:
    required:
    - gitlab.get_merge_request
    optional:
    - name: gitlab.create_merge_request_thread
      enables: unattended inline posting when policy allows
    degraded_modes:
      gitlab.create_merge_request_thread: fall back to summary-only or chat-only posting
        per auto-post-policy.md
  lint:
    skill_md_max_lines: 180
    target: pr-gatekeeper
  risk_class:
  - posting
  - unattended
  # Defense-in-depth/explicitness only, not load-bearing correctness -- the auto-detector
  # (scripts/registry/platform_detection.py) independently classifies this skill as ["posix"]
  # from its scripts/idempotency_store.py's fcntl usage alone (see gap-backlog F2's design doc,
  # Phase 0's gating test requires this). validate_platform_declarations fails make generate
  # --check/cmd_validate if this override ever drifts from that derivation.
  platforms:
  - posix
  version: 1.1.0
  type: trigger
  authority: comment
  permissions:
    repository: read
    external_actions: write
    unattended: true
    merge: false
  output_contract:
    produces:
    - mr_review_report
  dependencies:
  - pr-review
  version_source: skill_frontmatter_legacy_numeric
  degraded_behavior:
    missing_capability: gitlab.get_merge_request
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: GitLab MCP (via pr-review), webhook receiver (host infra)
  routing:
    patterns:
    - \b(PR|MR|pull request|merge request)\b.*\b(webhook|gatekeeper|automation gate|opened
      event)\b
