pr-gatekeeper:
  path: pr-gatekeeper
  category: review
  invocation: automation-only
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires:
    - pr-review
  composition:
    invokes:
    - pr-review
    escalation_targets:
    - pr-review
    consumes:
    - mr_context
    consume_fields:
      mr_context:
      - project
      - merge_request_iid
      - head_sha
  capabilities:
    required:
    - gitlab.get_merge_request
    optional:
    - name: gitlab.create_merge_request_thread
      enables: unattended inline posting when policy allows
    degraded_modes:
      gitlab.create_merge_request_thread: fall back to summary-only or chat-only posting
        per auto-post-policy.md
  lint:
    skill_md_max_lines: 180
    target: pr-gatekeeper
  risk_class:
  - posting
  - unattended
  version: 1.1.0
  type: trigger
  authority: comment
  permissions:
    repository: read
    external_actions: write
    unattended: true
    merge: false
  output_contract:
    produces:
    - mr_review_report
    produce_fields:
      mr_review_report:
      - review_metadata
      - posted
      - head_sha
      - posting_mode
      - integrated_revision
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies:
  - pr-review
  version_source: skill_frontmatter_legacy_numeric
  degraded_behavior:
    missing_capability: gitlab.get_merge_request
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: GitLab MCP (via pr-review), webhook receiver (host infra)
  routing:
    patterns:
    - \b(PR|MR|pull request|merge request)\b.*\b(webhook|gatekeeper|automation gate|opened
      event)\b
