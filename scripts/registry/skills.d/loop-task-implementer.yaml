loop-task-implementer:
  path: loop-task-implementer
  category: automation
  invocation: ambient
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    kiro:
      discovery: manual
  install:
    requires: []
  capabilities:
    required:
    - host.repository.read_write
    - host.role.isolation
    - host.ci.status
    - host.pull_request.write
    optional:
    - name: host.issue_tracker.read
      enables: task sourced from tracker instead of user text
    degraded_modes:
      host.issue_tracker.read: task must be supplied as direct user text; cannot autonomously
        source tasks from a tracker query
  lint:
    skill_md_max_lines: 180
    target: loop-task-implementer
  risk_class:
  - merge
  - repository-write
  version: 1.4.0
  type: orchestrator
  authority: repository-write
  permissions:
    repository: write
    external_actions: write
    unattended: false
    merge: true
  supported_hosts:
  - chatgpt
  - claude
  - codex
  - cursor
  - generic
  - kiro
  entrypoint: SKILL.md
  output_contract:
    produces:
    - implementation_pr
    produce_fields: {}
  dependencies: []
  version_source: skill_frontmatter_legacy_numeric
