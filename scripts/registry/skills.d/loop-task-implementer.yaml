loop-task-implementer:
  path: loop-task-implementer
  category: automation
  invocation: ambient
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires: []
  capabilities:
    required:
    - host.repository.read_write
    - host.role.isolation
    - host.ci.status
    - host.pull_request.write
    optional:
    - name: host.issue_tracker.read
      enables: task sourced from tracker instead of user text
    degraded_modes:
      host.issue_tracker.read: task must be supplied as direct user text; cannot autonomously
        source tasks from a tracker query
  lint:
    skill_md_max_lines: 180
    target: loop-task-implementer
  risk_class:
  - merge
  - repository-write
  version: 1.4.0
  type: orchestrator
  authority: repository-write
  permissions:
    repository: write
    external_actions: write
    unattended: false
    merge: true
  output_contract:
    produces:
    - implementation_pr
    produce_fields: {}
  dependencies: []
  version_source: skill_frontmatter_legacy_numeric
  composition:
    consumes:
    - implementation_task
    - prd_report
    - implementation_plan
    consume_fields:
      implementation_plan:
      - plan_set_id
      - plan_id
      - title
      - readiness
      - assessment_target
      - target_repo
      - external_dependencies
      - source_refs
      - tasks
      - execution_waves
      - sequencing_constraints
      - verification_gates
      - traceability
  degraded_behavior:
    missing_capability: host.repository.read_write
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: Git provider/API, CI provider (both repo-specific; no fixed
      MCP)
  routing:
    patterns:
    - \bimplement\b.*\b(task|ticket|change)\b.*\b(review|fix|until|loop)\b
    - \brepeat\b.*\b(review|fix)\b.*\b(0 issues|zero issues)\b
