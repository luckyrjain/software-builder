integration-test-creator:
  path: integration-test-creator
  category: testing
  invocation: ambient
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires: []
  capabilities:
    required:
    - host.repository.read_write
    optional:
    - name: host.test_runner.execute
      enables: generated test verification loop
    - name: host.dependency.reachable
      enables: real adjacent dependency under test
    degraded_modes:
      host.test_runner.execute: tests are written but left UNVERIFIED; run-until-green
        iteration cannot happen locally
      host.dependency.reachable: no real adjacent dependency to test against; escalate
        or skip the target rather than fall back to mocking (that belongs to unit-test-creator)
  lint:
    skill_md_max_lines: 180
    target: integration-test-creator
  risk_class:
  - repository-write
  version: 1.1.0
  type: leaf
  authority: repository-write
  permissions:
    repository: write
    external_actions: read
    unattended: false
    merge: false
  output_contract:
    produces:
    - test_suite
    produce_fields:
      test_suite:
      - tests
      - framework
      - target_path
  dependencies: []
  version_source: skill_frontmatter_legacy_numeric
  composition:
    consumes:
    - implementation_task
    consume_fields:
      implementation_task:
      - task_id
      - scope
      - acceptance_criteria
      - request
      - repo_root
      - target
      - test_framework_hint
      - run_tests
      - max_files_per_run
      - deadline
      - session_token_budget
      - output_dir
      - specialist_inputs
  degraded_behavior:
    missing_capability: host.repository.read_write
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: Docker / testcontainers (local)
  routing:
    patterns:
    - \b(integration tests?|integration-test)\b
