who-owns-x-bot:
  path: who-owns-x-bot
  category: architecture
  invocation: automation-only
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires:
    - squad-map
  capabilities:
    required:
    - slack.slash_command.receive
    optional:
    - name: squad-map.invoke
      enables: full mapping table instead of one-shot lookup
  lint:
    skill_md_max_lines: 180
    target: who-owns-x-bot
  risk_class:
  - unattended
  version: 1.0.0
  type: router
  authority: read-only
  permissions:
    repository: read
    external_actions: write
    unattended: true
    merge: false
  output_contract:
    produces:
    - ownership_lookup
    produce_fields: {}
  dependencies:
  - squad-map
  version_source: skill_frontmatter_legacy_numeric
  composition:
    consumes:
    - mr_context
  degraded_behavior:
    missing_capability: slack.slash_command.receive
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: squad-map (Slack handler is host infra)
  routing:
    patterns:
    - \bwho owns\b
    - \bownership lookup\b.*\b(slack|slash command|bot)\b
