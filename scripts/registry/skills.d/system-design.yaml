system-design:
  path: system-design
  category: architecture
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    escalation_targets:
    - api-design-review
    - database-review
    - observability-review
  capabilities:
    required:
    - host.report.write
    optional: []
  lint:
    skill_md_max_lines: 180
    target: system-design
  version: 1.2.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - system_design_spec
    produce_fields:
      system_design_spec:
      - title
      - readiness
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies: []
