system-design:
  path: system-design
  category: architecture
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    escalation_targets:
    - api-design-review
    - database-review
    - observability-review
    consumes:
    - prd_report
    - architecture_review_report
    consume_fields:
      prd_report:
      - title
      - build_readiness
      - depth
      - response_mode
      - assessment_target
      - normalized_decision
      - evidence_refs
      architecture_review_report:
      - title
      - decision
      - assessment_target
      - normalized_decision
      - evidence_refs
  capabilities:
    required:
    - host.report.write
    optional: []
  lint:
    skill_md_max_lines: 180
    target: system-design
  version: 1.2.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - system_design_spec
    produce_fields:
      system_design_spec:
      - title
      - readiness
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies: []
  degraded_behavior:
    missing_capability: host.report.write
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads supplied architecture decision/PRD content and
      repository only
  routing:
    patterns:
    - \b(system design|technical design doc|component design|data model design)\b
    - \bready PRD\b.*\bimplementation design\b
    exclude_patterns:
    - \bwhat\b.*\bservices?\b.*\b(touch|affected|impact)\b
