capacity-planner:
  path: capacity-planner
  category: platform
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    escalation_targets:
    - k8s-overprovisioning-datadog
    consumes:
    - assessment_context
    consume_fields:
      assessment_context:
      - assessment_target
      - inputs
      - input_provenance
      - evidence_refs
      - unresolved
  capabilities:
    required:
    - host.report.write
    optional: []
  lint:
    skill_md_max_lines: 180
    target: capacity-planner
  version: 1.1.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - capacity_plan
    produce_fields:
      capacity_plan:
      - title
      - headroom
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies: []
  degraded_behavior:
    missing_capability: host.report.write
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads supplied historical demand data only
  routing:
    patterns:
    - \b(capacity plan(?:ning)?|capacity forecast|scaling requirements)\b
