architecture-review:
  path: architecture-review
  category: review
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    escalation_targets:
    - system-design
    - security-review
    - loop-task-implementer
    - prd-architect
    consumes:
    - system_design_spec
    - prd_report
    consume_fields:
      system_design_spec:
      - title
      - readiness
      - assessment_target
      - normalized_decision
      - evidence_refs
      prd_report:
      - title
      - build_readiness
      - depth
      - response_mode
      - assessment_target
      - normalized_decision
      - evidence_refs
  capabilities:
    required:
    - host.report.write
    optional: []
  lint:
    skill_md_max_lines: 180
    target: architecture-review
  version: 1.2.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - architecture_review_report
    produce_fields:
      architecture_review_report:
      - title
      - decision
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies: []
  degraded_behavior:
    missing_capability: host.report.write
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads supplied PRD/design content and repository only
  routing:
    patterns:
    - \b(architecture review|ADR|architecture decision record|architecture design
      review)\b
    - \bproposed architecture\b
