incident-triage-agent:
  path: incident-triage-agent
  category: incident
  invocation: automation-only
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires:
    - incident-rca
    - squad-map
  composition:
    invokes:
    - incident-rca
    - squad-map
    escalation_targets:
    - incident-rca
    - squad-map
    consumes:
    - mr_context
    consume_fields:
      mr_context:
      - project
      - head_sha
  capabilities:
    required:
    - pager.webhook.receive
    optional:
    - name: slack.post.message
      enables: paging summary delivery when configured
    degraded_modes:
      slack.post.message: still produce the triage_doc/postmortem_draft artifact;
        paging summary is simply not delivered to Slack
  lint:
    skill_md_max_lines: 180
    target: incident-triage-agent
  risk_class:
  - unattended
  version: 1.0.0
  type: trigger
  authority: read-only
  permissions:
    repository: read
    external_actions: write
    unattended: true
    merge: false
  output_contract:
    produces:
    - rca_report
    - ownership_lookup
    produce_fields:
      rca_report:
      - assessment_metadata
      - root_cause
      - confidence
      ownership_lookup:
      - query
      - squad
      - confidence
  dependencies:
  - incident-rca
  - squad-map
  version_source: skill_frontmatter_legacy_numeric
  degraded_behavior:
    missing_capability: pager.webhook.receive
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: PagerDuty/Opsgenie webhook (host infra), incident-rca MCPs,
      squad-map
  routing:
    patterns:
    - \b(pager|page|alert webhook|incident webhook)\b.*\b(triage|automation|route|owner)\b
    - \btriage\b.*\b(pager|page|alert webhook|incident webhook)\b
