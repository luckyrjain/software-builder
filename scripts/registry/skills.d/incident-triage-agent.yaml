incident-triage-agent:
  path: incident-triage-agent
  category: incident
  invocation: automation-only
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    kiro:
      discovery: manual
  install:
    requires:
    - incident-rca
    - squad-map
  composition:
    invokes:
    - incident-rca
    - squad-map
    escalation_targets:
    - incident-rca
    - squad-map
  capabilities:
    required:
    - pager.webhook.receive
    optional:
    - name: slack.post.message
      enables: paging summary delivery when configured
    degraded_modes:
      slack.post.message: still produce the triage_doc/postmortem_draft artifact;
        paging summary is simply not delivered to Slack
  lint:
    skill_md_max_lines: 180
    target: incident-triage-agent
  risk_class:
  - unattended
  version: 1.0.0
  type: trigger
  authority: read-only
  permissions:
    repository: read
    external_actions: write
    unattended: true
    merge: false
  supported_hosts:
  - chatgpt
  - claude
  - codex
  - cursor
  - generic
  - kiro
  entrypoint: SKILL.md
  output_contract:
    produces:
    - rca_report
    - ownership_lookup
    produce_fields:
      rca_report:
      - assessment_metadata
      - root_cause
      - confidence
      ownership_lookup:
      - query
      - squad
      - confidence
  dependencies:
  - incident-rca
  - squad-map
  version_source: skill_frontmatter_legacy_numeric
