performance-review:
  path: performance-review
  category: review
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    escalation_targets:
    - capacity-planner
    consumes:
    - assessment_context
    consume_fields:
      assessment_context:
      - assessment_target
      - inputs
      - input_provenance
      - evidence_refs
      - unresolved
  capabilities:
    required:
    - host.report.write
    optional: []
  lint:
    skill_md_max_lines: 180
    target: performance-review
  version: 1.1.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - performance_review_report
    produce_fields:
      performance_review_report:
      - title
      - verdict
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies: []
  degraded_behavior:
    missing_capability: host.report.write
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads supplied code/query content and repository only
  routing:
    patterns:
    - \b(performance review|N\+1|slow query review|concurrency review)\b
