migration-program-manager:
  path: migration-program-manager
  category: migration
  invocation: ambient
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires:
    - mysql-to-postgres-sql
    - squad-map
  composition:
    mode: aggregate
    escalation_targets:
    - mysql-to-postgres-sql
    - squad-map
    - pr-review
    consumes: []
  capabilities:
    required:
    - host.filesystem.read
    optional:
    - name: mysql-to-postgres-sql.invoke
      enables: single-workspace migration status refresh
  lint:
    skill_md_max_lines: 180
    target: migration-program-manager
  risk_class:
  - read-only
  version: 1.0.0
  type: orchestrator
  authority: read-only
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - migration_status_rollup
    produce_fields:
      migration_status_rollup:
      - items
      - generated_at
      - source_revision
  dependencies:
  - mysql-to-postgres-sql
  - squad-map
  version_source: skill_frontmatter_legacy_numeric
  degraded_behavior:
    missing_capability: host.filesystem.read
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: None (reads MIGRATION_STATUS.yaml + SQUAD_MAP.md on disk)
  routing:
    patterns:
    - \b(migration program|migration portfolio|migration status rollup|migration program
      status)\b
