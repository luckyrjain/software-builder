prd-architect:
  path: prd-architect
  category: product
  invocation: ambient
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires: []
  composition:
    escalation_targets:
    - loop-task-implementer
    - domain-comprehension
    - test-writer
    - pr-review
    consumes:
    - implementation_task
    consume_fields:
      implementation_task:
      - task_id
      - scope
      - acceptance_criteria
  capabilities:
    required:
    - host.report.write
    optional: []
  lint:
    skill_md_max_lines: 180
    target: prd-architect
  risk_class:
  - read-only
  version: 1.3.0
  type: leaf
  authority: read-only
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - prd_report
    produce_fields:
      prd_report:
      - title
      - build_readiness
      - depth
      - response_mode
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies: []
  version_source: skill_frontmatter_legacy_numeric
  degraded_behavior:
    missing_capability: host.report.write
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: Optional web search for material unknowns (generalized queries
      only)
  routing:
    patterns:
    - \b(PRD|product requirements?|requirements document|build readiness)\b
    exclude_patterns:
    - \bready PRD\b.*\bimplementation design\b
    - \bready PRD\b.*\bsystem design\b
