prd-architect:
  path: prd-architect
  category: product
  invocation: ambient
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    kiro:
      discovery: manual
  install:
    requires: []
  composition:
    escalation_targets:
    - loop-task-implementer
    - domain-comprehension
    - test-writer
    - pr-review
  capabilities:
    required:
    - host.report.write
    optional: []
  lint:
    skill_md_max_lines: 180
    target: prd-architect
  risk_class:
  - read-only
  version: 1.3.0
  type: leaf
  authority: read-only
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  supported_hosts:
  - chatgpt
  - claude
  - codex
  - cursor
  - generic
  - kiro
  entrypoint: SKILL.md
  output_contract:
    produces:
    - prd_report
    produce_fields:
      prd_report:
      - title
      - build_readiness
      - depth
      - response_mode
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies: []
  version_source: skill_frontmatter_legacy_numeric
