engineering-decision-discovery:
  path: skills/engineering-decision-discovery
  category: architecture
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    invokes: []
    escalation_targets:
    - module-design
    - architecture-review
  capabilities:
    required:
    - host.report.write
    - host.repository.read
    optional: []
  lint:
    skill_md_max_lines: 180
    target: engineering-decision-discovery
  version: 1.0.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - engineering_decision_record
  dependencies: []
  degraded_behavior:
    missing_capability: host.repository.read
    available_capabilities:
    - host.report.write
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads repository and caller-provided context only
  routing:
    patterns:
    - \b(grill me|challenge my plan|stress[- ]test this( [\w-]+)? decision|question my assumptions|help me decide|what decisions are missing|interrogate this architecture)\b
    exclude_patterns:
    - \b(PR|MR|pull request|merge request)\s*[#!]?\d+\b
