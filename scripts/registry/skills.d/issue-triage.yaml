issue-triage:
  path: skills/issue-triage
  category: analysis
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    invokes: []
    escalation_targets:
    - security-review
    - incident-rca
    - prd-architect
    - tech-debt-assessor
    - squad-map
  capabilities:
    required:
    - host.report.write
    - host.repository.read
    optional: []
  lint:
    skill_md_max_lines: 180
    target: issue-triage
  version: 1.0.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - issue_triage_report
  dependencies: []
  degraded_behavior:
    missing_capability: host.repository.read
    available_capabilities:
    - host.report.write
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads repository and caller-provided context only
  routing:
    # WARNING TO FUTURE EDITORS: do not reintroduce ANY standalone "is this a duplicate ..."
    # pattern here, with or without an anchor noun, and do not let patterns 1 and 2 drift back
    # to different noun sets. Both mistakes were already made here and the first one cost two
    # full review rounds.
    #
    # ROOT CAUSE of the duplicate-pattern collisions (two rounds of symptom-patching before
    # this diagnosis landed). "Is this a duplicate of ...?" is generic English: is / this / a /
    # duplicate / of are all domain-neutral words, so the construction attaches to a statement
    # about anything -- a CVE, a migration script, a PR, a deployment config -- and steals
    # ownership from the real owner. The plan's original bare `\bis this\b.*\ba duplicate\b`
    # failed 118 of 172 swept combinations. Round 1 tried requiring a co-occurring
    # issue/bug/ticket/report ANCHOR noun; that failed because the wrapper-writer can put the
    # anchor inside the wrapper phrase itself ("Is this issue a duplicate? {other skill's
    # request}") -- 41 of 43 siblings collided. Round 2 tried requiring the adjacent literal
    # "a duplicate of"; that failed the same way one word over ("Is this a duplicate of an
    # existing issue? {other skill's request}") -- 287 of 301 combinations collided.
    #
    # The generalisation, finally: a regex cannot distinguish "this word describes the
    # WRAPPER's intent" from "this word describes the WRAPPED content", because this registry's
    # pattern language has no proximity or lookahead mechanism to express that distinction.
    # Every anchor bolted onto a domain-neutral construction is therefore placeable inside the
    # wrapper, whichever word it is and wherever in the phrase it sits. No further noun-set
    # widening, reordering or adjacency trick can close this; each attempt just moves the hole.
    #
    # Patterns 1 and 2 were never vulnerable, and the reason is the fix: `triage` and `classify`
    # are genuinely issue-triage-SPECIFIC verbs (verified -- zero other skills in this registry
    # use either word anywhere in their own routing patterns), so safety comes from the VERB
    # being domain-specific, not from any noun/anchor choice. Patterns 3 and 4 therefore require
    # the duplicate question to CO-OCCUR with that already-proven-safe verb vocabulary, in both
    # orderings, instead of with a swappable anchor noun.
    #
    # ACCEPTED RECALL LOSS, deliberately taken: a bare, standalone "Is this a duplicate of issue
    # #42?" with no "triage"/"classify" word anywhere no longer matches on its own. That is the
    # correct trade against the alternative -- an unfixable-with-simple-regex collision surface
    # that has already produced two false-negative-free but false-positive-riddled rounds. The
    # skill is ambient, so such a request still reaches it once the caller frames it as triage
    # ("Triage this: is this a duplicate of issue #42?"), which is what examples.md's duplicate
    # rows now show. See scripts/tests/test_issue_triage_routing.py, whose `_wrapped_duplicate`
    # carries one template per wrapper style (12 of them): a wrapper style no template exercises
    # is a style nothing has verified, which is precisely how rounds 1 and 2 each shipped a hole.
    #
    # Patterns 1 and 2 share the identical, full noun set. They previously used different,
    # asymmetric ones (pattern 1 had `tickets?` but not `feature requests?`, pattern 2 the
    # reverse), so "Triage these raw feature requests" and "Classify these incoming tickets"
    # both went no_match despite being squarely this skill's own domain. Verified that 0 of 43
    # sibling positive-eval prompts match either bare: only this skill's own specific invocation
    # phrasing triggers them.
    patterns:
    - \btriage\b.*\b(these|the|raw|incoming)\b.*\b(issues?|bugs?|tickets?|feature requests?)\b
    - \bclassify\b.*\b(these|the)\b.*\b(issues?|bugs?|tickets?|feature requests?)\b
    - \b(triage|classify)\b.*\bis this\b.*\ba duplicate\b
    - \bis this\b.*\ba duplicate\b.*\b(triage|classify)\b
    # A 3rd exclude, `\bovernight\b.*\btracker query\b`, used to sit between the two groups below
    # and is deliberately GONE. It was transcribed from this skill's own "when NOT to use" prose
    # ("an already-scoped tracker query to work through -- backlog-runner"), not from an observed
    # collision, and the phrase "tracker query" appears in zero prompts anywhere in evals/ -- it
    # is documentation vocabulary, not user vocabulary. Three findings against it, all verified
    # on the live dispatcher:
    #   * It protected nothing. evals/negative/cases.yaml's backlog-runner row ("Run backlog
    #     tickets overnight and implement each one until zero issues.") matches none of this
    #     skill's include patterns to begin with, so the patterns, not the exclude, are what
    #     keep it with backlog-runner. Removing the exclude leaves it selected: backlog-runner.
    #   * It missed the real backlog-runner overlap it was supposed to cover, which contains no
    #     "tracker query" at all, so the exclude never fired on it.
    #   * It created a no-owner hole -- the strictly worst dispatcher outcome, a request no skill
    #     is responsible for. "Triage the overnight tracker query results and classify these
    #     tickets." fired include patterns 1 AND 2, was stripped by this exclude, and then went
    #     no_match because backlog-runner's own pattern requires "tickets" BEFORE "overnight" and
    #     this phrasing has it after. An exclude must never be able to leave a prompt ownerless;
    #     locked in by a regression test.
    #
    # THE EXCLUDE RULE THIS FRAGMENT NOW FOLLOWS: an exclude that defers to a sibling skill must
    # MIRROR THAT SIBLING'S OWN INCLUDE PATTERNS VERBATIM. Both excludes below previously used
    # vocabulary the sibling does not itself recognise, so they fired in cases the sibling's own
    # pattern would NOT -- stripping issue-triage from prompts the sibling then failed to pick
    # up, i.e. manufacturing exactly the no-owner holes the removed 3rd exclude did (3 such
    # prompts for the pager exclude, 4 for the PR/MR one, all found in review). Mirroring makes
    # orphaning impossible BY CONSTRUCTION: the exclude fires if and only if the sibling's own
    # include also fires, so the prompt always lands with the sibling.
    #
    # Exclude 1-2 mirror incident-triage-agent's own two routing patterns exactly (see
    # scripts/registry/skills.d/incident-triage-agent.yaml). The previous form,
    # `\b(pager|page-fire|webhook)\b.*\bincident\b`, used a bare "webhook", a "page-fire" that
    # appears nowhere in incident-triage-agent's patterns, and "incident" where that skill keys
    # on triage/automation/route/owner. This exclude must be KEPT (unlike the dead 3rd one)
    # because incident-triage-agent serves the unattended, no-human-turn paging path where an
    # `ambiguous` verdict has nobody to resolve it; dropping it would make live paging events
    # ambiguous between an unattended agent and this interactive skill. Mirroring satisfies the
    # plan's Global Constraint ("never collide with incident-triage-agent's routing") without
    # the orphaning risk that motivated narrowing it.
    #
    # Known, accepted consequence of mirroring exclude 2 verbatim: incident-triage-agent's own
    # `\btriage\b.*\bpage\b` is broad enough to claim an in-domain triage request that merely
    # mentions a UI "page" ("Triage these incoming bugs: one says the settings page fails to load
    # after an incident last week." -> incident-triage-agent). That is a wrong-OWNER outcome, not
    # a no-owner one -- strictly milder than the orphaning this exclude used to cause, and it
    # originates in incident-triage-agent's own include pattern, not in this fragment. Narrowing
    # it on this side would break the if-and-only-if property and reopen orphaning; the fix, if
    # it is ever worth making, belongs in that skill's own fragment.
    #
    # Exclude 3-4 mirror pr-review's own two routing patterns exactly (see
    # scripts/registry/skills.d/pr-review.yaml). The previous form fired on `merge (it|this)` /
    # `approve` language that pr-review's own patterns do not recognise at all -- same orphaning
    # bug. With the mirror in place, an in-domain triage request that only incidentally mentions
    # a PR/MR ("Triage these incoming bug reports: one references PR #456 as a related fix.")
    # keeps its owner, while a genuine review request inside a triage prompt goes to pr-review.
    exclude_patterns:
    - \b(pager|page|alert webhook|incident webhook)\b.*\b(triage|automation|route|owner)\b
    - \btriage\b.*\b(pager|page|alert webhook|incident webhook)\b
    - \b(review|inspect|analy[sz]e)\b.*\b(PR|MR|pull request|merge request|diff)\b
    - \b(PR|MR|pull request|merge request)\b.*\b(review|regression|correctness)\b
