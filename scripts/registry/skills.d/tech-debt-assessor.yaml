tech-debt-assessor:
  path: tech-debt-assessor
  category: platform
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    escalation_targets:
    - migration-program-manager
    - cost-optimization-sprint-planner
    consumes: []
  capabilities:
    required:
    - host.report.write
    optional: []
  lint:
    skill_md_max_lines: 180
    target: tech-debt-assessor
  version: 1.0.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - tech_debt_assessment
    produce_fields:
      tech_debt_assessment:
      - title
      - items
  dependencies: []
  degraded_behavior:
    missing_capability: host.report.write
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads repository content and supplied backlog data only
  routing:
    patterns:
    - \b(tech(?:nical)? debt (?:assess|priorit|rank)|debt backlog)\b
