squad-map:
  path: squad-map
  category: architecture
  invocation: ambient
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires: []
  capabilities:
    required:
    - gitlab.list_projects
    optional:
    - name: gitlab.get_repository_file
      enables: CODEOWNERS and ownership file reads
    - name: datadog.list_service_definitions
      enables: service alias crosswalk
    degraded_modes:
      gitlab.get_repository_file: ownership falls back to fuzzy/contributor-based
        signals only, confidence capped at LOW
      datadog.list_service_definitions: skip the service alias crosswalk; ownership
        stays repo-level only
  lint:
    skill_md_max_lines: 180
    target: squad-map
  risk_class:
  - read-only
  version: 1.0.0
  type: leaf
  authority: read-only
  permissions:
    repository: read
    external_actions: read
    unattended: false
    merge: false
  output_contract:
    produces:
    - squad_map
    - ownership_lookup
    produce_fields: {}
  dependencies: []
  version_source: skill_frontmatter_legacy_numeric
  composition:
    consumes:
    - mr_context
  degraded_behavior:
    missing_capability: gitlab.list_projects
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: GitLab MCP, Datadog MCP
  routing:
    patterns:
    - \b(squad map|ownership map|CODEOWNERS|service ownership map)\b
