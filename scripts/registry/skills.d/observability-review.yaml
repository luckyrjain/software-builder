observability-review:
  path: observability-review
  category: review
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    escalation_targets:
    - incident-rca
    - deployment-risk-review
    consumes:
    - assessment_context
    consume_fields:
      assessment_context:
      - assessment_target
      - inputs
      - input_provenance
      - evidence_refs
      - unresolved
  capabilities:
    required:
    - host.report.write
    optional: []
  lint:
    skill_md_max_lines: 180
    target: observability-review
  version: 1.1.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - observability_review_report
    produce_fields:
      observability_review_report:
      - title
      - coverage
      - assessment_target
      - normalized_decision
      - findings
      - conditions
      - required_actions
      - evidence_refs
  dependencies: []
  degraded_behavior:
    missing_capability: host.report.write
    available_capabilities: []
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads supplied metrics/logs/dashboard/alert configuration
      and repository only
  routing:
    patterns:
    - \b(observability review|SLO review|alert coverage|tracing coverage)\b
