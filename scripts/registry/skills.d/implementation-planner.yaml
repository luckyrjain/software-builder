implementation-planner:
  path: implementation-planner
  category: automation
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    invokes: []
    escalation_targets:
    - loop-task-implementer
    consumes:
    - system_design_spec
    - architecture_review_report
    - change_impact_report
    - api_design_review_report
    - database_review_report
    - security_review_report
    - performance_review_report
    - capacity_plan
    - observability_review_report
    - resilience_review_report
    - dependency_upgrade_report
    consume_fields:
      system_design_spec:
      - title
      - readiness
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
      architecture_review_report:
      - title
      - decision
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
      change_impact_report:
      - title
      - assessment_target
      - coverage_status
      - material_unknowns
      - impacted_repositories
      - criticality
      - change_classes
      - impacted_services
      - impacted_contracts
      - impacted_data
      - impacted_dependencies
      - impacted_owners
      - required_tests
      - operational_impacts
      - review_triggers
      - unknowns
      - evidence_refs
      api_design_review_report:
      - title
      - verdict
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
      database_review_report:
      - title
      - verdict
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
      security_review_report:
      - title
      - verdict
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
      performance_review_report:
      - title
      - verdict
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
      capacity_plan:
      - title
      - headroom
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
      observability_review_report:
      - title
      - coverage
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
      resilience_review_report:
      - title
      - verdict
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
      dependency_upgrade_report:
      - title
      - verdict
      - assessment_target
      - normalized_decision
      - conditions
      - required_actions
      - evidence_refs
  capabilities:
    required:
    - host.report.write
    - host.repository.read
    optional: []
  lint:
    skill_md_max_lines: 180
    target: implementation-planner
  version: 1.0.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - implementation_plan
    produce_fields:
      implementation_plan:
      - plan_set_id
      - plan_id
      - title
      - readiness
      - assessment_target
      - target_repo
      - external_dependencies
      - source_refs
      - tasks
      - execution_waves
      - sequencing_constraints
      - verification_gates
      - traceability
  dependencies: []
  degraded_behavior:
    missing_capability: host.repository.read
    available_capabilities:
    - host.report.write
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads supplied design/review artifacts and optional
      repository evidence only
  routing:
    patterns:
    - \b(implementation plan|implementation planning|implementation task DAG|task
      decomposition|dependency[- ]aware plan|execution waves)\b
