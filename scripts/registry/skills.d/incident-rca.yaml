incident-rca:
  path: incident-rca
  category: incident
  invocation: ambient
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires: []
  composition:
    escalation_targets:
    - pr-review
    - k8s-overprovisioning-datadog
    - squad-map
  capabilities:
    required:
    - telemetry.logs.query
    optional:
    - name: datadog.query_metrics
      enables: metric corroboration paths
    - name: gitlab.get_merge_request
      enables: deploy-regression MR handoff
    degraded_modes:
      datadog.query_metrics: rely on logs alone for corroboration; cap confidence
        below what a matching metric signal would support
      gitlab.get_merge_request: treat deploy-regression hypothesis as UNKNOWN rather
        than ruled in or out, not as absence of evidence
  lint:
    skill_md_max_lines: 180
    target: incident-rca
  risk_class:
  - read-only
  version: 2.0.0
  type: leaf
  authority: read-only
  permissions:
    repository: read
    external_actions: read
    unattended: false
    merge: false
  supported_hosts:
  - chatgpt
  - claude
  - codex
  - cursor
  - generic
  - kiro
  entrypoint: SKILL.md
  output_contract:
    produces:
    - rca_report
    produce_fields: {}
  dependencies: []
  version_source: skill_frontmatter
