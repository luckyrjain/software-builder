architecture-remediation-loop:
  path: skills/architecture-remediation-loop
  category: architecture
  invocation: ambient
  hosts:
    cursor:
      discovery: rule
    claude:
      install: true
    github-copilot:
      discovery: manual
    kiro:
      discovery: manual
  install:
    requires:
    - codebase-architecture-review
    - engineering-decision-discovery
    - module-design
    - loop-task-implementer
    - production-readiness-review
  composition:
    invokes:
    - loop-task-implementer
    - production-readiness-review
    escalation_targets:
    - codebase-architecture-review
    - engineering-decision-discovery
    - module-design
    - loop-task-implementer
    - production-readiness-review
    - domain-comprehension
    consumes:
    - codebase_architecture_report
    - engineering_decision_record
    - module_design_spec
    - implementation_pr
    - production_readiness_report
  capabilities:
    required:
    - host.report.write
    - loop-task-implementer.invoke
    optional:
    - name: codebase-architecture-review.invoke
      enables: architecture-discovery cycle
    - name: engineering-decision-discovery.invoke
      enables: candidate grilling and disposition
    - name: module-design.invoke
      enables: module/interface/seam design for candidates that need it
    - name: production-readiness-review.invoke
      enables: holistic cumulative-branch gate
  lint:
    skill_md_max_lines: 180
    target: architecture-remediation-loop
  risk_class:
  - repository-write
  version: 1.0.0
  type: orchestrator
  authority: repository-write
  permissions:
    repository: write
    external_actions: write
    unattended: false
    merge: false
  output_contract:
    produces:
    - architecture_remediation_report
    produce_fields: {}
  dependencies:
  - codebase-architecture-review
  - engineering-decision-discovery
  - module-design
  - loop-task-implementer
  - production-readiness-review
  degraded_behavior:
    missing_capability: loop-task-implementer.invoke
    available_capabilities:
    - host.report.write
    - codebase-architecture-review.invoke
    - engineering-decision-discovery.invoke
    - module-design.invoke
    - production-readiness-review.invoke
    behavior: BLOCKED
  setup_freshness:
    external_services: None of its own — inherits whatever each composed skill requires
  routing:
    patterns:
    - \b(architecture remediation loop|whole[- ]codebase architecture (improvement|remediation)|architecture
      (improvement|remediation) loop)\b
    - \b(architecture|codebase)\b.*\b(remediation loop|convergence loop|until (zero|clean|convergence))\b
    exclude_patterns:
    - \b(PR|MR|pull request|merge request)\s*[#!]?\d+\b
