bug-diagnosis:
  path: skills/bug-diagnosis
  category: review
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    invokes: []
    escalation_targets:
    - loop-task-implementer
    - incident-rca
    - codebase-architecture-review
  capabilities:
    required:
    - host.report.write
    - host.repository.read
    optional: []
  lint:
    skill_md_max_lines: 180
    target: bug-diagnosis
  version: 1.0.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - bug_diagnosis_report
  dependencies: []
  degraded_behavior:
    missing_capability: host.repository.read
    available_capabilities:
    - host.report.write
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads repository and caller-provided context only
  routing:
    patterns:
    - \bdiagnose\b.*\b(this|the)\b.*\b(bug|failure|regression|test)\b
    - \bwhy is(n't)?\b.*\bfailing\b
    - \broot[ -]cause\b.*\b(test failure|bug)\b|\b(test failure|bug)\b.*\broot[ -]cause\b
    - \breproduce\b.*\bthis\b.*\bbug\b
    - \bregression\b.*\bdiagnos\w*\b|\bdiagnos\w*\b.*\bregression\b
    exclude_patterns:
    - \boutage\b|\berror spike\b
    - \bjust fix (it|this)\b
    - \b(right now|currently)\b.*\bproduction\b|\bproduction\b.*\b(right now|currently)\b
