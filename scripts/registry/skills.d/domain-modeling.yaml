domain-modeling:
  path: skills/domain-modeling
  category: architecture
  extends: read-only-leaf-review
  install:
    requires: []
  composition:
    invokes: []
    escalation_targets:
    - domain-comprehension
    - module-design
    - architecture-review
  capabilities:
    required:
    - host.report.write
    - host.repository.read
    optional: []
  lint:
    skill_md_max_lines: 180
    target: domain-modeling
  version: 1.0.0
  type: leaf
  permissions:
    repository: read
    external_actions: none
    unattended: false
    merge: false
  output_contract:
    produces:
    - domain_model_update
  dependencies: []
  degraded_behavior:
    missing_capability: host.repository.read
    available_capabilities:
    - host.report.write
    behavior: BLOCKED
  setup_freshness:
    external_services: None — reads repository and caller-provided context only
  routing:
    patterns:
    - \b(domain model|ubiquitous language|glossary)\b.*\b(term|terminology|CONTEXT\.md|ADR)\b
    - \b(sharpen|pin down|challenge)\b.*\b(domain|terminology|glossary)\b.*\b(term|language)\b
    - \bpropose\b.*\bADR\b.*\bdecision\b
    exclude_patterns:
    - \b(bounded contexts?|current[- ]state domain|subsystem onboarding|multi-repo)\b
    - \b(module design|module boundary|seam design|adapter design|interface design)\b
    - \b(PR|MR|pull request|merge request)\b
