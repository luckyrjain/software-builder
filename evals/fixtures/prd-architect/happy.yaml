schema_version: 1
skill: prd-architect
case_id: happy-contract
tier: 1
description: prd-architect exposes pipeline workflow and output contract
assertions:
  - type: file_exists
    path: reference/output-contract.md
  - type: file_exists
    path: report-template.md
  - type: file_exists
    path: workflow-contract.yaml
  - type: skill_md_contains
    pattern: Pipeline routing
  - type: path_contains
    path: reference/phase-index.md
    pattern: Validate → Specify → Break → Repair → Gate
  - type: path_contains
    path: workflow-contract.yaml
    pattern: full_prd_override
  - type: workflow_frontmatter_all
  - type: registry_invocation
    expected: ambient
