schema_version: 1
skill: module-design
case_id: deep-module-quality
tier: 2
description: >
  A faithful current-main transcript for src/payments/charge.py: repository
  read, the contract-evidence gate, a module_design_spec report write, and a
  complete outcome. This is the RED baseline for Matt-parity design-quality
  (docs/superpowers/specs/2026-09-05-matt-architecture-parity-bridge.md,
  R1-R5/R7-R9): the read-only assertions below stay green against this
  transcript, but the design_comparison assertion fails because current main
  never emits a design_comparison event contrasting a deep, policy-owning
  module (with a concrete provider adapter seam) against a thin pass-through
  wrapper (with caller-owned policy). Tasks 2-6 make the skill produce that
  event; this fixture is not modified to make it pass.
events:
  - type: tool
    name: repository_read
    args:
      paths: [src/payments/charge.py, tests/test_charge.py]
  - type: gate
    name: contract_evidence
    decision: sufficient_for_report
  - type: tool
    name: report_write
    args:
      artifact: module_design_spec
  - type: outcome
    status: complete
assertions:
  # Pre-existing read-only invariants -- must stay green.
  - type: tool_called
    name: repository_read
  - type: gate_decision
    name: contract_evidence
    decision: sufficient_for_report
  - type: tool_called
    name: report_write
  - type: tool_not_called
    name: repository_write
  - type: tool_not_called
    name: invoke_downstream_skill
  - type: outcome_status
    status: complete
  # RED: Matt-parity design-comparison quality assertion. current main never emits a
  # design_comparison event, so this fails on this faithful current-main transcript
  # until Tasks 2-6 land.
  - type: event_data_equals
    event: design_comparison
    path: deep_design.provider_seam
    value: concrete_adapter
