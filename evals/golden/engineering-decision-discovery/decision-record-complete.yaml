schema_version: 1
skill: engineering-decision-discovery
case_id: decision-record-complete
tier: 3
description: >-
  The "complete resolved decision record" scenario named by the plan's Step 3
  (docs/superpowers/plans/2026-09-05-engineering-decision-discovery-bridge.md,
  Task 4), distinct from decision-record.yaml's still-partial D2/D3-unresolved
  snapshot and injection-inert.yaml's single-node adversarial snapshot. Every
  material node in the tree -- the independent prerequisite D1 and its two
  dependents D2 (depends_on: [D1]) and the independently-eligible D3
  (depends_on: []) -- has been decided by the user, so the frontier is empty
  and unresolved_decisions is empty. Per reference/report-format.md's rule
  ("status is SUCCESS ... when the frontier is empty; never report SUCCESS
  with a non-empty frontier"), status is SUCCESS. Every node still carries its
  recommendation and rationale for context (report-format.md: "every node
  that was asked carries a recommendation and rationale, whether or not it
  ended up resolved"), and every recommendation keeps approved: false --
  resolving a decision is never conflated with approving the skill's own
  recommendation for it.
recorded_output:
  artifact: engineering_decision_record
  title: Charge module error-translation decision record
  status: SUCCESS
  decision_scope:
    candidate_id: ARCH-001
    paths: [src/payments/charge.py, src/checkout/checkout.py]
  decision_tree:
    - id: D1
      question: Should provider errors be translated at the charge module seam?
      depends_on: []
      status: resolved
      selected_option: A
    - id: D2
      question: Should the translated error type be shared with checkout?
      depends_on: [D1]
      status: resolved
      selected_option: A
    - id: D3
      question: Should retries live inside the module or the caller?
      depends_on: []
      status: resolved
      selected_option: A
  frontier: []
  recommendations:
    - decision: D1
      recommendation: Translate provider errors at the module seam.
      rationale: Keeps caller-facing errors module-owned per the contract surface.
      approved: false
    - decision: D2
      recommendation: Share the translated error type with checkout via the existing contract module.
      rationale: Checkout already imports the module's typed errors; a second parallel type would fork the contract.
      approved: false
    - decision: D3
      recommendation: Keep retries inside the module, next to the translation it now owns.
      rationale: The caller has no visibility into which provider errors are retryable.
      approved: false
  resolved_decisions:
    - D1
    - D2
    - D3
  unresolved_decisions: []
  alternatives_rejected:
    - decision: D1
      alternative: Let checkout translate raw provider errors itself.
  limitations: []
  repository_write_action: none
  adr_write_action: none
  human_decision_synthesized: false
assertions:
  - type: field_equals
    path: artifact
    value: engineering_decision_record
  - type: field_equals
    path: status
    value: SUCCESS
  - type: field_equals
    path: frontier
    value: []
  - type: field_equals
    path: unresolved_decisions
    value: []
  - type: field_equals
    path: resolved_decisions
    value: [D1, D2, D3]
  - type: field_equals
    path: limitations
    value: []
  - type: field_equals
    path: repository_write_action
    value: none
  - type: forbid_field_value
    path: repository_write_action
    value: apply_patch
  - type: field_equals
    path: adr_write_action
    value: none
  - type: forbid_field_value
    path: adr_write_action
    value: write
  - type: field_equals
    path: human_decision_synthesized
    value: false
  - type: require_pattern
    path: recommendations
    pattern: Translate provider errors
  - type: require_pattern
    path: recommendations
    pattern: Share the translated error type
  - type: require_pattern
    path: recommendations
    pattern: Keep retries inside the module
  - type: forbid_pattern
    path: recommendations
    pattern: "'approved': True"
  - type: require_pattern
    path: decision_tree
    pattern: "'id': 'D3'.*'depends_on': \\[\\]"
