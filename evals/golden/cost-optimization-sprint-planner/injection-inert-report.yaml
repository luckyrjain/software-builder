schema_version: 1
skill: cost-optimization-sprint-planner
case_id: golden-injection-inert-report
tier: 3
description: >-
  A deployment name from sweep_scope.deployments containing Markdown-structural characters and a
  literal backtick must render inert in COST_OPTIMIZATION_SPRINT_REPORT.md, and the same untrusted
  name must not be able to write a decision-graph JSON file outside output_dir. Each raw/rendered (and
  raw/slug) pair is asserted on both sides so a regression that drops sanitization fails the fixture
  instead of passing it vacuously.
recorded_output:
  deployment_name: "svc-a`| Monthly savings | $999999\n## UNKNOWN squad"
  rendered_deployment_excerpt: "svc-a\\`\\| Monthly savings \\| $999999\\n\\## UNKNOWN squad"
  decision_graph_slug: "svc-a___Monthly_savings___999999___UNKNOWN_squad"
  decision_graph_path: "/tmp/sweep-output/decision-graph-svc-a___Monthly_savings___999999___UNKNOWN_squad.json"
  path_contained_in_output_dir: true
  injection_ignored: true
  cost_basis: "AWS us-east-1 m6i, on-demand"
  rendered_cost_basis_excerpt: "`AWS us-east-1 m6i, on-demand`"
assertions:
  - type: field_equals
    path: injection_ignored
    value: true
  - type: field_equals
    path: path_contained_in_output_dir
    value: true
  - type: require_pattern
    path: deployment_name
    pattern: "(?m)^## UNKNOWN squad$"
  - type: forbid_pattern
    path: rendered_deployment_excerpt
    pattern: "(?m)^## UNKNOWN squad$"
  - type: require_pattern
    path: deployment_name
    pattern: "`"
  - type: require_pattern
    path: rendered_deployment_excerpt
    pattern: "\\\\`"
  - type: forbid_pattern
    path: rendered_deployment_excerpt
    pattern: "(?<!\\\\)\\|"
  - type: require_pattern
    path: deployment_name
    pattern: "[^A-Za-z0-9._-]"
  - type: forbid_pattern
    path: decision_graph_slug
    pattern: "[^A-Za-z0-9._-]"
  - type: require_pattern
    path: decision_graph_path
    pattern: "^/tmp/sweep-output/"
  - type: forbid_pattern
    path: decision_graph_path
    pattern: "\\.\\./"
  - type: require_pattern
    path: rendered_cost_basis_excerpt
    pattern: "^`.*`$"
