schema_version: 1
skill: codebase-architecture-review
case_id: deepening-report
tier: 3
description: >
  A bounded src/orders review under Matt-parity report depth
  (docs/superpowers/specs/2026-09-05-matt-architecture-parity-bridge.md,
  R1-R5/R7-R9): read-only, no automatic refactor, one retained candidate
  falsified and carried through with a recommendation strength, dependency
  category, before model, after model, and deletion test per
  codebase-architecture-review/workflow/candidates.md and
  reference/report-format.md's candidate card fields.
recorded_output:
  artifact: codebase_architecture_report
  repository_write_action: none
  automatic_refactor: false
  scope:
    paths:
      - src/orders
  analysis_budget:
    fully_read_files: 8
    fully_read_file_limit: 200
    hotspots: 1
    hotspot_limit: 3
  history:
    status: available
    commits: 42
    days: 90
  candidates:
    - id: CAR-1
      recommendation_strength: Strong
      dependency_category: ports-and-adapters
      before_model: >-
        orders -> order_service -> fulfillment_client; fulfillment errors
        leak through order_service
      after_model: >-
        orders -> fulfillment; fulfillment -> fulfillment_adapter;
        fulfillment owns translation and idempotency policy
      deletion_test: >-
        Removing the module scatters fulfillment-provider translation and
        retry policy across order callers.
  candidate_count: 1
  top_recommendation:
    id: CAR-1
    recommendation_strength: Strong
    dependency_category: ports-and-adapters
    before_model: >-
      orders -> order_service -> fulfillment_client; fulfillment errors
      leak through order_service
    after_model: >-
      orders -> fulfillment; fulfillment -> fulfillment_adapter;
      fulfillment owns translation and idempotency policy
    deletion_test: >-
      Removing the module scatters fulfillment-provider translation and
      retry policy across order callers.
  recommended_next_skill: null
assertions:
  - type: field_equals
    path: artifact
    value: codebase_architecture_report
  - type: field_equals
    path: repository_write_action
    value: none
  - type: field_equals
    path: automatic_refactor
    value: false
  - type: field_equals
    path: candidate_count
    value: 1
  - type: field_equals
    path: recommended_next_skill
    value: null
  # Matt-parity visual/candidate-depth report fields (Task 6): report content per
  # codebase-architecture-review/workflow/candidates.md and reference/report-format.md's
  # candidate card fields, not a codebase_architecture_report schema widening.
  - type: field_equals
    path: top_recommendation.recommendation_strength
    value: Strong
  - type: field_present
    path: top_recommendation.dependency_category
  - type: field_present
    path: top_recommendation.before_model
  - type: field_present
    path: top_recommendation.after_model
  - type: field_present
    path: top_recommendation.deletion_test
