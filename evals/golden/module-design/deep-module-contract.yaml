schema_version: 1
skill: module-design
case_id: deep-module-contract
tier: 3
description: >
  A module contract for src/payments/charge.py as current main actually
  renders it: report-only, evidence-bounded contract surface. This is the RED
  baseline for Matt-parity design depth (docs/superpowers/specs/2026-09-05-matt-architecture-parity-bridge.md,
  R1-R5/R7-R9): the existing-shape assertions stay green against this
  recorded output, but the interface_surface/deletion_test/implementation_depth/design_comparison
  assertions fail because current main's module_design_spec has none of
  those fields. Tasks 2-6 add them to design.md and the module_design_spec
  contract; this fixture is not modified to make them pass.
recorded_output:
  artifact: module_design_spec
  repository_write_action: none
  automatic_downstream_invocation: false
  module_scope: src/payments/charge.py
  evidence_status: bounded
  contract_surface:
    - create_charge(command)
    - charge_status(charge_id)
  adapter_decision: translate vendor gateway failures into module-owned errors
  alternatives_rejected:
    - mock-only Gateway interface
assertions:
  - type: field_equals
    path: artifact
    value: module_design_spec
  - type: field_equals
    path: repository_write_action
    value: none
  - type: field_equals
    path: evidence_status
    value: bounded
  - type: require_pattern
    path: adapter_decision
    pattern: module-owned errors
  # RED: Matt-parity depth/deletion/visual-comparison fields absent from current main's spec.
  - type: field_present
    path: interface_surface
  - type: field_present
    path: deletion_test
  - type: field_present
    path: implementation_depth
  - type: field_present
    path: design_comparison
