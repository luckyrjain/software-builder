schema_version: 1
entry_inputs:
  user_message: {type: string, provenance: user_invocation, required: false, trust: untrusted}
  git_remote_url: {type: string, provenance: host_environment, required: false, trust: trusted}
  review_mode: {type: string, provenance: caller_or_user, required: false, trust: untrusted}
  posting_policy: {type: string, provenance: caller_or_user, required: false, trust: untrusted}
  expected_head_sha: {type: string, provenance: caller_or_user, required: false, trust: untrusted}
  review_target: {type: object, provenance: host_environment, required: false, trust: trusted}
  provider_capabilities: {type: object, provenance: host_environment, required: false, trust: trusted}
selector_domains:
  posting_decision: [post, skip]
route_selection: {after_phase: 2-3-gate}
routes:
  posting:
    when: {posting_decision: post}
    phases: [inputs, "0", "1", "2", 2-3-gate, 3-4, "5"]
  chat_only:
    when: {posting_decision: skip}
    phases: [inputs, "0", "1", "2", 2-3-gate, "5"]
