# Declarative host/target/capability registry validated by
# scripts/registry/host_registry.py (`make validate-hosts`).
#
# Capabilities here start UNVERIFIED/UNKNOWN by design: each capability must
# earn AVAILABLE/VERIFIED through its own RUNTIME evidence entry rather than
# inheriting the support levels already recorded in
# scripts/registry/host_contracts.yaml (the pre-existing host/capability
# matrix consumed by host_adapter.py and the P1 adapter-generation path).
# The two files intentionally answer different questions -- host_contracts.yaml
# is "what does the generated adapter support today", this file is "what has
# been independently re-verified" -- so do not treat a mismatch between them
# as a bug without checking which question is being asked. This registry is
# the canonical, evidence-gated host-identity source (spec Section 13) and
# grows independently of host_adapter.HOSTS -- a host may exist here with no
# host_contracts.yaml/host_adapter.py entry at all (see github-copilot below).
schema_version: 1

targets:
  # Universal Agent Skills target (Candidate 7): a shared, multi-tool discovery directory rather
  # than a single host's own. --agent agents installs here directly, not routed through any
  # specific host's target list -- see scripts/registry/universal_install_resolver.py.
  - id: agents-user
    scope: user
    path: ~/.agents/skills
  - id: agents-project
    scope: project
    path: "{project_root}/.agents/skills"
  - id: cursor-user
    scope: user
    path: ~/.cursor/skills
  - id: cursor-project
    scope: project
    path: "{project_root}/.cursor/skills"
  - id: claude-user
    scope: user
    path: ~/.claude/skills
  - id: claude-project
    scope: project
    path: "{project_root}/.claude/skills"
  # Kiro has exactly one real surface, and it isn't an install.sh destination: unlike every other
  # target above, scripts/registry/generate_kiro.py writes `.kiro/steering/<skill>.md` at a fixed
  # repo-root path via `make generate` -- a checked-in, versioned artifact of software-builder's
  # own checkout, never a per-user ($HOME) or per-target-repo (`install.sh --target-dir`) copy.
  # There is no `--agent kiro` in install.sh; nothing in this repo ever calls resolve_target_path
  # against this target, and no future addition should either -- it exists here only so the `kiro`
  # host entry below can carry a schema-valid discovery binding. `scope: project` /
  # `{project_root}/` is reused only because it's the closest-shaped existing schema primitive
  # (path template + validation); for this one target, `{project_root}` always means "the
  # software-builder checkout `make generate` ran in", never install.sh's `--target-dir`.
  # (A prior version of this file additionally declared `kiro-user` at `~/.kiro/steering`, implying
  # a second, $HOME-scoped destination -- purely fictional; nothing has ever read or written there.
  # See Candidate 9's blocker note in
  # docs/superpowers/specs/2026-08-31-universal-agent-compatibility-design.md for the full story.)
  - id: kiro-generated
    scope: project
    path: "{project_root}/.kiro/steering"
  # GitHub Copilot's own dedicated discovery paths (Candidate 12), per GitHub's official docs
  # (see the copilot host's evidence entry below). Copilot's docs also state it recognizes
  # .claude/skills, .agents/skills (project) and ~/.agents/skills (user) as alternatives, with no
  # stated precedence order among them -- only Copilot's own dedicated paths are modeled as
  # discovery bindings here, to avoid inventing a precedence order the source doesn't state. A
  # user who wants a Copilot-discoverable install today can already use --agent agents
  # (Candidate 7) for that documented alternative.
  - id: github-copilot-user
    scope: user
    path: ~/.copilot/skills
  - id: github-copilot-project
    scope: project
    path: "{project_root}/.github/skills"

aliases: []

hosts:
  - id: cursor
    surfaces:
      - kind: LOCAL
        discovery:
          - target: cursor-project
            mode: NATIVE
            precedence: 10
          - target: cursor-user
            mode: NATIVE
            precedence: 20
    capabilities:
      host.filesystem.read: UNKNOWN
      host.repository.read_write: UNKNOWN
    isolation:
      mode: UNKNOWN
    constraints: []
    verification: UNVERIFIED
    evidence: []
    maintainer_support: BEST_EFFORT

  - id: claude
    surfaces:
      - kind: LOCAL
        discovery:
          - target: claude-project
            mode: NATIVE
            precedence: 10
          - target: claude-user
            mode: NATIVE
            precedence: 20
    capabilities:
      host.filesystem.read: UNKNOWN
      host.repository.read_write: UNKNOWN
    isolation:
      mode: UNKNOWN
    constraints: []
    verification: UNVERIFIED
    evidence: []
    maintainer_support: BEST_EFFORT

  # verification stays UNVERIFIED and capabilities stay UNKNOWN, matching every other host here:
  # the evidence below is DOCUMENTATION-kind only (GitHub's own published discovery mechanism),
  # not RUNTIME evidence -- host_registry.py's own schema requires RUNTIME evidence before
  # verification may become VERIFIED (spec Section 26), and this repo has not run Copilot to
  # confirm the documented behavior actually holds. maintainer_support is BEST_EFFORT rather than
  # the FIRST_CLASS spec Section 27 would technically permit for a documented host, to stay
  # consistent with cursor/claude/kiro's own baseline above rather than introduce an unexplained
  # inconsistency across hosts that are all equally UNVERIFIED.
  - id: github-copilot
    surfaces:
      - kind: LOCAL
        discovery:
          - target: github-copilot-project
            mode: NATIVE
            precedence: 10
          - target: github-copilot-user
            mode: NATIVE
            precedence: 20
    capabilities:
      host.filesystem.read: UNKNOWN
      host.repository.read_write: UNKNOWN
    isolation:
      mode: UNKNOWN
    constraints: []
    verification: UNVERIFIED
    evidence:
      - kind: DOCUMENTATION
        reference: "https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/add-skills"
    maintainer_support: BEST_EFFORT

  - id: kiro
    surfaces:
      - kind: LOCAL
        discovery:
          - target: kiro-generated
            mode: ADAPTER
            precedence: 10
    capabilities:
      host.filesystem.read: UNKNOWN
      host.repository.read_write: UNKNOWN
    isolation:
      mode: UNKNOWN
    constraints:
      - "not install.sh-resolvable: kiro-generated is a fixed, repo-root-only artifact regenerated
        by `make generate` (scripts/registry/generate_kiro.py), not a per-user or per-target-repo
        install destination -- there is no `--agent kiro` selector and none should be added without
        first correcting this constraint"
    verification: UNVERIFIED
    evidence: []
    maintainer_support: BEST_EFFORT
