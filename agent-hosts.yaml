schema_version: 1

targets:
  - id: cursor-user
    scope: user
    path: ~/.cursor/skills
  - id: cursor-project
    scope: project
    path: "{project_root}/.cursor/skills"
  - id: claude-user
    scope: user
    path: ~/.claude/skills
  - id: claude-project
    scope: project
    path: "{project_root}/.claude/skills"
  - id: kiro-user
    scope: user
    path: ~/.kiro/steering
  - id: kiro-project
    scope: project
    path: "{project_root}/.kiro/steering"

aliases: []

hosts:
  - id: cursor
    surfaces:
      - kind: LOCAL
        discovery:
          - target: cursor-project
            mode: NATIVE
            precedence: 10
          - target: cursor-user
            mode: NATIVE
            precedence: 20
    capabilities:
      host.filesystem.read: UNKNOWN
      host.repository.read_write: UNKNOWN
    isolation:
      mode: UNKNOWN
    constraints: []
    verification: UNVERIFIED
    evidence: []
    maintainer_support: BEST_EFFORT

  - id: claude
    surfaces:
      - kind: LOCAL
        discovery:
          - target: claude-project
            mode: NATIVE
            precedence: 10
          - target: claude-user
            mode: NATIVE
            precedence: 20
    capabilities:
      host.filesystem.read: UNKNOWN
      host.repository.read_write: UNKNOWN
    isolation:
      mode: UNKNOWN
    constraints: []
    verification: UNVERIFIED
    evidence: []
    maintainer_support: BEST_EFFORT

  - id: kiro
    surfaces:
      - kind: LOCAL
        discovery:
          - target: kiro-project
            mode: ADAPTER
            precedence: 10
          - target: kiro-user
            mode: ADAPTER
            precedence: 20
    capabilities:
      host.filesystem.read: UNKNOWN
      host.repository.read_write: UNKNOWN
    isolation:
      mode: UNKNOWN
    constraints: []
    verification: UNVERIFIED
    evidence: []
    maintainer_support: BEST_EFFORT
