schema_version: 1

skills:
  pr-review:
    path: pr-review
    category: review
    invocation: ambient
    hosts:
      cursor: {discovery: rule}
      claude: {install: true}
      kiro: {discovery: manual}
    install:
      requires: []
    composition:
      escalation_targets: [incident-rca, k8s-overprovisioning-datadog]
    capabilities:
      required: [gitlab.get_merge_request, gitlab.get_merge_request_diffs]
      optional:
        - name: gitlab.create_merge_request_thread
          enables: inline diff posting
        - name: gitlab.create_note
          enables: summary-only MR posting
      degraded_modes:
        gitlab.create_merge_request_thread: summary-only or chat-only posting
        gitlab.create_note: chat-only posting
    lint:
      skill_md_max_lines: 180
      target: pr-review

  pr-gatekeeper:
    path: pr-gatekeeper
    category: review
    invocation: automation-only
    hosts:
      cursor: {discovery: rule}
      claude: {install: true}
      kiro: {discovery: manual}
    install:
      requires: [pr-review]
    composition:
      invokes: [pr-review]
      escalation_targets: [pr-review]
    capabilities:
      required: [gitlab.get_merge_request]
      optional:
        - name: gitlab.create_merge_request_thread
          enables: unattended inline posting when policy allows
    lint:
      skill_md_max_lines: 180
      target: pr-gatekeeper

  k8s-overprovisioning-datadog:
    path: k8s-overprovisioning-datadog
    category: platform
    invocation: ambient
    hosts:
      cursor: {discovery: rule}
      claude: {install: true}
      kiro: {discovery: manual}
    install:
      requires: []
    composition:
      escalation_targets: [incident-rca, pr-review]
    capabilities:
      required: [datadog.query_metrics]
      optional:
        - name: datadog.list_monitors
          enables: monitor cross-check sections
    lint:
      skill_md_max_lines: 150
      target: k8s-skill

  incident-rca:
    path: incident-rca
    category: incident
    invocation: ambient
    hosts:
      cursor: {discovery: rule}
      claude: {install: true}
      kiro: {discovery: manual}
    install:
      requires: []
    composition:
      escalation_targets: [pr-review, k8s-overprovisioning-datadog, squad-map]
    capabilities:
      required: [telemetry.logs.query]
      optional:
        - name: datadog.query_metrics
          enables: metric corroboration paths
        - name: gitlab.get_merge_request
          enables: deploy-regression MR handoff
    lint:
      skill_md_max_lines: 180
      target: incident-rca

  incident-triage-agent:
    path: incident-triage-agent
    category: incident
    invocation: automation-only
    hosts:
      cursor: {discovery: rule}
      claude: {install: true}
      kiro: {discovery: manual}
    install:
      requires: [incident-rca, squad-map]
    composition:
      invokes: [incident-rca, squad-map]
      escalation_targets: [incident-rca, squad-map]
    capabilities:
      required: [pager.webhook.receive]
    lint:
      skill_md_max_lines: 180
      target: incident-triage-agent

  domain-comprehension:
    path: domain-comprehension
