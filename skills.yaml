    category: review
    invocation: automation-only
    hosts:
      cursor:
        discovery: rule
      claude:
        install: true
      kiro:
        discovery: manual
    install:
      requires:
      - pr-review
    composition:
      invokes:
      - pr-review
      escalation_targets:
      - pr-review
    capabilities:
