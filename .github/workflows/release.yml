name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.4.0); checks out that tag before packaging"
        required: true
        type: string

# Each job below declares its own permissions; job-level permissions replace (not merge with)
# this block, so nothing is granted here.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload and the release-tag checkout
      id-token: write # cosign's keyless OIDC signing
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! printf '%s' "$DISPATCH_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "error: invalid tag format: $DISPATCH_TAG" >&2
              exit 1
            fi
            echo "name=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
          python3 -m pip install --require-hashes -r requirements.lock

      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: python3 scripts/verify_release_tag.py "$RELEASE_TAG"

      - name: Lint and package release
        env:
          # Without this, lint-actions-security's zizmor step silently falls back to
          # --no-online-audits here (unlike lint.yml, which already sets this) — a release run
          # is exactly the one place this check should run at full strength.
          GH_TOKEN: ${{ github.token }}
        run: |
          make lint
          make package-release

      - name: Validate release contract
        run: python3 scripts/release_contract.py

      - name: Verify release bundle
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 scripts/verify_release_bundle.py --repo-root . "dist/software-builder-${VERSION}.tar.gz"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "dist/software-builder-${VERSION}.tar.gz" \
            "dist/software-builder-${VERSION}.sha256" \
            "dist/software-builder-${VERSION}.files.sha256" \
            --clobber 2>/dev/null || \
          gh release create "$RELEASE_TAG" \
            --title "software-builder ${VERSION}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${RELEASE_TAG}/CHANGELOG.md)." \
            "dist/software-builder-${VERSION}.tar.gz" \
            "dist/software-builder-${VERSION}.sha256" \
            "dist/software-builder-${VERSION}.files.sha256"

      - name: Build and upload sb wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          python3 scripts/build_sb_snapshot.py
          python3 -m build --wheel --outdir dist/sb-wheel cli/
          WHEEL_PATH="$(ls dist/sb-wheel/software_builder_cli-*.whl)"
          sha256sum "$WHEEL_PATH" > "${WHEEL_PATH}.sha256"
          gh release upload "$RELEASE_TAG" "$WHEEL_PATH" "${WHEEL_PATH}.sha256" --clobber
          echo "WHEEL_PATH=$WHEEL_PATH" >> "$GITHUB_ENV"

      - name: Build and upload plugin bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 -m scripts.registry package-plugin --output "dist/software-builder-plugin-${VERSION}.tar.gz"
          ( cd dist && sha256sum "software-builder-plugin-${VERSION}.tar.gz" > "software-builder-plugin-${VERSION}.tar.gz.sha256" )
          gh release upload "$RELEASE_TAG" \
            "dist/software-builder-plugin-${VERSION}.tar.gz" \
            "dist/software-builder-plugin-${VERSION}.tar.gz.sha256" \
            --clobber

      - name: Generate SBOM for sb wheel
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ env.WHEEL_PATH }}
          format: cyclonedx-json
          output-file: dist/sb-wheel/software-builder-cli.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARTIFACTS=(
            "dist/software-builder-${VERSION}.tar.gz"
            "${WHEEL_PATH}"
            "dist/software-builder-plugin-${VERSION}.tar.gz"
            "dist/sb-wheel/software-builder-cli.cdx.json"
          )
          BUNDLES=()
          for artifact in "${ARTIFACTS[@]}"; do
            cosign sign-blob --yes --bundle "${artifact}.cosign.bundle" "$artifact"
            BUNDLES+=("${artifact}.cosign.bundle")
          done
          gh release upload "$RELEASE_TAG" \
            "dist/sb-wheel/software-builder-cli.cdx.json" \
            "${BUNDLES[@]}" \
            --clobber

      - name: Generate provenance subjects
        id: hash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          HASHES=$(sha256sum \
            "dist/software-builder-${VERSION}.tar.gz" \
            "${WHEEL_PATH}" \
            "dist/software-builder-plugin-${VERSION}.tar.gz" \
            "dist/sb-wheel/software-builder-cli.cdx.json" \
            | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

  provenance:
    needs: release
    permissions:
      actions: read # generator reads this workflow run's metadata to build provenance
      id-token: write # generator signs the provenance keylessly via OIDC
      contents: write # generator's own asset upload (see upload-assets/upload-tag-name below)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] generator requires a tag ref; see check_pinned_actions.py's exemption for why
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.tag }}
