# F1 review-evidence gate (Track B). Design doc:
# docs/superpowers/specs/2026-09-24-f1-review-evidence-gate-design.md
#
# Four jobs:
#   review-evidence-check           -- the required status check itself (Phase 0: authored, not
#                                       yet added to docs/github-ruleset-main.json's required list
#                                       -- that's Phase 3, a separate manual repo-admin step).
#   review-evidence-analyze         -- read-only: classifies a PR's sensitivity and writes a
#                                       verdict artifact. Never checks out the PR ref, never
#                                       writes to GitHub or the repo.
#   review-evidence-post            -- write-only: the only job holding `pull-requests: write`;
#                                       reads a verdict artifact it didn't produce and posts an
#                                       APPROVED review under a bot identity, never near PR-branch
#                                       content.
#   check-sensitive-path-bypass     -- weekly (+ workflow_dispatch): scans merged PRs for a
#                                       sensitive-path change that landed without a passing
#                                       review-evidence-check run, and alerts on its own failure
#                                       too. Wired here because this is the one workflow file this
#                                       change is scoped to touch; scripts/check_sensitive_path_bypass.py
#                                       is otherwise a standalone, independently-invocable CLI.
#
# `review-evidence-post` is triggered by `workflow_run` watching THIS workflow's own name (a
# workflow watching itself is a standard, non-looping pattern here: `review-evidence-post` only
# ever runs *from* a `workflow_run` event whose own trigger was `pull_request`, per its `if:`
# below -- a run it itself produced, whose trigger is `workflow_run`, is explicitly excluded, so
# it cannot re-trigger itself).
name: Review Evidence

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] review-evidence-post (the only job this
    # trigger drives) never checks out the PR ref or any repository content, and only ever acts
    # on values GitHub itself attaches to the workflow_run event (run id, pull_requests[0].number,
    # head_repository.full_name) -- never anything read from the analyzed diff or PR body. See
    # that job's own comments for the full reasoning; this is the "safe" workflow_run shape
    # zizmor's audit-confidence is explicitly Medium about, not the "checks out and executes
    # untrusted PR code with a privileged token" shape the audit exists to catch.
    workflows: ["Review Evidence"]
    types: [completed]
  schedule:
    # Weekly, off the top of the hour like this repo's other scheduled workflows (avoids the
    # :00 traffic spike many scheduled jobs collide on).
    - cron: "23 5 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

# One concurrency group per PR (falling back to the triggering run's own id for non-PR events --
# schedule/workflow_dispatch runs of check-sensitive-path-bypass -- so they never collide with
# each other or with a PR's group). `cancel-in-progress: true` means a new push (or a new review
# landing) supersedes an in-flight evaluation of a now-stale head, and a stale review-evidence-post
# mid-approve for a PR that just received a new push is itself superseded rather than racing it --
# design doc, APIs table and Retries & idempotency.
concurrency:
  group: "review-evidence-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id || github.run_id }}"
  cancel-in-progress: true

jobs:
  review-evidence-check:
    name: review-evidence-check
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's *base* commit, never the PR ref itself (design doc, APIs table: "neither
          # ever checks out the PR ref"). The enforcement script and sensitive-path list that run
          # here are always the trusted base-branch version -- a PR can never change what
          # evaluates it by editing its own copy of either.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Evaluate review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_review_evidence.py check --repo "$REPO" --pr "$PR_NUMBER"

  review-evidence-analyze:
    name: review-evidence-analyze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same base-commit rationale as review-evidence-check above.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Classify sensitivity and write a verdict artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/check_review_evidence.py analyze --repo "$REPO" --pr "$PR_NUMBER"
          --out review-evidence-verdict.json

      - name: Upload verdict artifact
        # Only when the PR was actually sensitive (build_verdict writes nothing otherwise) --
        # analyze "exits immediately, doing nothing further, if the PR isn't sensitive" (design
        # doc, Components table).
        if: hashFiles('review-evidence-verdict.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-evidence-verdict
          path: review-evidence-verdict.json
          retention-days: 14

  review-evidence-post:
    name: review-evidence-post
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # review-evidence-check and review-evidence-analyze are sibling jobs in the SAME
      # pull_request-triggered workflow run, and review-evidence-check is *expected* to fail on
      # essentially every push (no approval exists yet) -- so `github.event.workflow_run.conclusion`
      # (that whole run's aggregate conclusion across every job) is a poor proxy for "did
      # review-evidence-analyze itself succeed": it would read "failure" on the overwhelming
      # majority of legitimate runs, permanently blocking this job from ever posting. Querying
      # the Actions Jobs API for review-evidence-analyze's own, individual job conclusion (using
      # the `actions: read` permission this job already holds for artifact download) is the
      # correct, job-scoped signal the design's round-3 "cancelled run -> clean no-op" fix
      # (Failure strategy) actually needs.
      - name: Confirm review-evidence-analyze succeeded
        id: analyze_status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name=="review-evidence-analyze") | .conclusion' | head -n1)
          echo "review-evidence-analyze conclusion: ${conclusion:-<not found>}"
          if [ "$conclusion" = "success" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no-op: review-evidence-analyze did not succeed on this run -- nothing to post"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verdict artifact
        if: steps.analyze_status.outputs.proceed == 'true'
        # A non-sensitive PR produces no artifact at all -- download-artifact fails the step by
        # default when the named artifact doesn't exist for this run, which is an expected,
        # harmless outcome here (nothing to post), not a real job failure. The next step checks
        # for the file's presence explicitly instead of trusting this step's own outcome.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-evidence-verdict
          # Explicitly pinned to the triggering run, never a bare name-only lookup (design doc,
          # APIs table and round-3 revision history finding 3).
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post review evidence if the verdict approves
        if: steps.analyze_status.outputs.proceed == 'true'
        env:
          REPO: ${{ github.repository }}
          # The trigger event's own PR association, never a value derived from the analyzed diff
          # or PR body (design doc, Components table and Failure-strategy table).
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          # Provisioned separately (Phase 0 rollout step, not part of this change): a PAT or
          # GitHub App install scoped to `pull-requests: write` only. The default GITHUB_TOKEN's
          # Actions-bot identity cannot post an APPROVED review on GitHub at all (a platform
          # restriction, not a scoping choice) -- this is why a genuinely separate credential is
          # required, not just a wider default-token permission.
          BOT_TOKEN: ${{ secrets.REVIEW_EVIDENCE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f review-evidence-verdict.json ]; then
            echo "no-op: no verdict artifact was produced for this run (PR was not sensitive) -- nothing to post"
            exit 0
          fi

          verdict=$(python3 -c 'import json; print(json.load(open("review-evidence-verdict.json")).get("verdict", ""))')
          artifact_pr=$(python3 -c 'import json; print(json.load(open("review-evidence-verdict.json")).get("pr_number", ""))')

          if [ "$artifact_pr" != "$PR_NUMBER" ]; then
            echo "no-op: verdict artifact's pr_number ($artifact_pr) does not match this run's own PR ($PR_NUMBER) -- refusing to act on it" >&2
            exit 0
          fi

          if [ "$verdict" != "approve" ]; then
            echo "no-op: verdict is '$verdict', not 'approve' -- nothing to post"
            exit 0
          fi

          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "warning: REVIEW_EVIDENCE_BOT_TOKEN is not configured -- cannot post an APPROVED review under a bot identity. Provision this secret before Phase 1's live smoke test (design doc, Rollout Phase 0)." >&2
            exit 0
          fi

          GH_TOKEN="$BOT_TOKEN" gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            --body "Automated review evidence: this PR's sensitive-path change was classified by review-evidence-analyze. See the workflow run for details."

  check-sensitive-path-bypass:
    name: check-sensitive-path-bypass
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Scan for sensitive-path merges without review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/check_sensitive_path_bypass.py --repo "$REPO"
