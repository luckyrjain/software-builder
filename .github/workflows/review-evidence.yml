# F1 review-evidence gate (Track B). Design doc:
# docs/superpowers/specs/2026-09-24-f1-review-evidence-gate-design.md
#
# Two jobs:
#   review-evidence-check           -- the required status check itself (Phase 0: authored, not
#                                       yet added to docs/github-ruleset-main.json's required list
#                                       -- that's Phase 3, a separate manual repo-admin step).
#   check-sensitive-path-bypass     -- weekly (+ workflow_dispatch): scans merged PRs for a
#                                       sensitive-path change that landed without a passing
#                                       review-evidence-check run, and alerts on its own failure
#                                       too. Wired here rather than in its own file because this
#                                       change touches only one new workflow file beyond this one
#                                       (review-evidence-post.yml, see below);
#                                       scripts/check_sensitive_path_bypass.py is otherwise a
#                                       standalone, independently-invocable CLI.
#
# There is deliberately NO `review-evidence-analyze` job in this file anymore (round-1 Phase 0
# shipped one; it was removed in the remediation that added this comment -- see PR #298's
# description for the full trust-boundary writeup). Reason: for a plain `pull_request`-triggered
# job, GitHub Actions resolves that job's *step definitions* -- not just the ref a checkout step
# happens to pin -- from the PR's own head/merge ref, regardless of what `ref:` the checkout step
# itself requests. A same-repo PR author could therefore edit this file's
# `review-evidence-analyze` job in the same PR (e.g. replace its "classify and write a verdict"
# step with a one-liner that writes `{"verdict":"approve",...}` directly) and have THAT forged
# step run instead of the real one, because the step list itself came from the PR branch, not
# from `main`. `review-evidence-post` (workflow_run-triggered, so ITS OWN step definitions are
# always resolved from `main`'s trusted copy -- see that file) used to trust whatever verdict
# artifact such a job produced, checking only that the run's conclusion was "success" and that
# the artifact's self-reported `pr_number` matched -- neither check requires the artifact to have
# come from real, unforgeable analysis. Net effect: any same-repo PR (no fork needed) could forge
# a real, bot-issued APPROVED review with zero actual review -- the exact actor class (autonomous
# same-repo Builder PRs touching sensitive paths) this whole mechanism exists to check.
#
# Fix: eliminate trust in anything computed by a job whose step definitions are resolvable from
# the PR's own branch. `review-evidence-post.yml` now independently re-runs
# `scripts/check_review_evidence.py analyze`'s classification logic itself, against a
# base-branch-pinned checkout (workflow_run's default `GITHUB_SHA` is always the tip of the
# repository's default branch, never the PR's ref) and its own `gh pr diff` fetch -- it consumes
# nothing computed by any `pull_request`-triggered job in this file. `review-evidence-check`
# itself is unaffected: it already only ever checked out `github.event.pull_request.base.sha` and
# never wrote anything, so it carried none of this risk.
#
# `review-evidence-post` -- write-only, the only job holding `pull-requests: write` -- is
# deliberately not a job in this file. The design specifies it as triggered by `workflow_run`
# watching this workflow's own completion; GitHub rejects that outright at the API level
# ("Workflow 'X' cannot listen to itself", verified against this exact file while authoring it --
# `gh workflow run` fails with HTTP 422 and the whole file's jobs stop registering at all, not
# just the offending job). A `workflow_run` trigger can only watch a *different* workflow file, so
# `review-evidence-post` lives in the sibling file `.github/workflows/review-evidence-post.yml`,
# which watches this one by name ("Review Evidence"). See that file's own header comment and this
# PR's description for the full reasoning.
name: Review Evidence

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  schedule:
    # Weekly, off the top of the hour like this repo's other scheduled workflows (avoids the
    # :00 traffic spike many scheduled jobs collide on).
    - cron: "23 5 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

# One concurrency group per PR (falling back to the triggering run's own id for non-PR events --
# schedule/workflow_dispatch runs of check-sensitive-path-bypass -- so they never collide with
# each other or with a PR's group). Concurrency groups are repository-wide, not scoped per
# workflow file, so this exact group-name formula is intentionally duplicated verbatim in
# review-evidence-post.yml: a new push's fresh review-evidence-check/-analyze run supersedes a
# still-in-flight review-evidence-post attempt to approve the now-stale prior head, rather than
# racing it (design doc, APIs table and Retries & idempotency). `github.event.workflow_run.*`
# never actually populates in *this* file (it has no `workflow_run` trigger) -- kept only so both
# files resolve to the identical group name for the same PR.
concurrency:
  group: "review-evidence-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id || github.run_id }}"
  cancel-in-progress: true

jobs:
  review-evidence-check:
    name: review-evidence-check
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's *base* commit, never the PR ref itself (design doc, APIs table: "neither
          # ever checks out the PR ref"). The enforcement script and sensitive-path list that run
          # here are always the trusted base-branch version -- a PR can never change what
          # evaluates it by editing its own copy of either.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Evaluate review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f scripts/check_review_evidence.py ]; then
            echo "scripts/check_review_evidence.py does not exist at this base commit -- the review-evidence gate has not been adopted here yet; nothing to enforce, exiting cleanly"
            exit 0
          fi
          python3 scripts/check_review_evidence.py check --repo "$REPO" --pr "$PR_NUMBER"

  check-sensitive-path-bypass:
    name: check-sensitive-path-bypass
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Scan for sensitive-path merges without review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/check_sensitive_path_bypass.py --repo "$REPO"
