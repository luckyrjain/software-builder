# F1 review-evidence gate (Track B). Design doc:
# docs/superpowers/specs/2026-09-24-f1-review-evidence-gate-design.md
#
# `review-evidence-post` -- write-only, the only job in this whole mechanism holding
# `pull-requests: write`; reads a verdict artifact it didn't produce and posts an APPROVED review
# under a bot identity, never near PR-branch content.
#
# This is a separate file from `review-evidence.yml` (which holds `review-evidence-check`,
# `review-evidence-analyze`, and `check-sensitive-path-bypass`) purely because GitHub Actions
# rejects a `workflow_run` trigger that watches its own workflow's completion outright: "Workflow
# 'Review Evidence' cannot listen to itself" (HTTP 422 from `gh workflow run`/the Actions API,
# verified against `review-evidence.yml` while authoring this change -- a self-referencing
# `workflow_run` trigger doesn't just skip that one job, it invalidates the *entire* file, so
# nothing in it runs at all). A `workflow_run` trigger can only watch a genuinely different
# workflow file, which is the only reason this job lives here instead of alongside its siblings.
name: Review Evidence Post

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] this job never checks out the PR ref or any
    # repository content, and only ever acts on values GitHub itself attaches to the workflow_run
    # event (run id, pull_requests[0].number, head_repository.full_name) -- never anything read
    # from the analyzed diff or PR body. See the job's own step comments for the full reasoning;
    # this is the "safe" workflow_run shape zizmor's audit-confidence is explicitly Medium about,
    # not the "checks out and executes untrusted PR code with a privileged token" shape the audit
    # exists to catch.
    workflows: ["Review Evidence"]
    types: [completed]

permissions:
  contents: read

# Deliberately the identical group-name formula review-evidence.yml uses (concurrency groups are
# repository-wide, not scoped per workflow file): a new push's fresh review-evidence-check/-analyze
# run supersedes a still-in-flight attempt here to approve the now-stale prior head, rather than
# racing it (design doc, APIs table and Retries & idempotency).
concurrency:
  group: "review-evidence-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id || github.run_id }}"
  cancel-in-progress: true

jobs:
  review-evidence-post:
    name: review-evidence-post
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # review-evidence-check and review-evidence-analyze are sibling jobs in the SAME
      # pull_request-triggered run of review-evidence.yml, and review-evidence-check is *expected*
      # to fail on essentially every push (no approval exists yet) -- so
      # `github.event.workflow_run.conclusion` (that whole run's aggregate conclusion across every
      # job) is a poor proxy for "did review-evidence-analyze itself succeed": it would read
      # "failure" on the overwhelming majority of legitimate runs, permanently blocking this job
      # from ever posting. Querying the Actions Jobs API for review-evidence-analyze's own,
      # individual job conclusion (using the `actions: read` permission this job already holds for
      # artifact download) is the correct, job-scoped signal the design's round-3 "cancelled run ->
      # clean no-op" fix (Failure strategy) actually needs.
      - name: Confirm review-evidence-analyze succeeded
        id: analyze_status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name=="review-evidence-analyze") | .conclusion' | head -n1)
          echo "review-evidence-analyze conclusion: ${conclusion:-<not found>}"
          if [ "$conclusion" = "success" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no-op: review-evidence-analyze did not succeed on this run -- nothing to post"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verdict artifact
        if: steps.analyze_status.outputs.proceed == 'true'
        # A non-sensitive PR produces no artifact at all -- download-artifact fails the step by
        # default when the named artifact doesn't exist for this run, which is an expected,
        # harmless outcome here (nothing to post), not a real job failure. The next step checks
        # for the file's presence explicitly instead of trusting this step's own outcome.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-evidence-verdict
          # Explicitly pinned to the triggering run, never a bare name-only lookup (design doc,
          # APIs table and round-3 revision history finding 3).
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post review evidence if the verdict approves
        if: steps.analyze_status.outputs.proceed == 'true'
        env:
          REPO: ${{ github.repository }}
          # The trigger event's own PR association, never a value derived from the analyzed diff
          # or PR body (design doc, Components table and Failure-strategy table).
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          # Provisioned separately (Phase 0 rollout step, not part of this change): a PAT or
          # GitHub App install scoped to `pull-requests: write` only. The default GITHUB_TOKEN's
          # Actions-bot identity cannot post an APPROVED review on GitHub at all (a platform
          # restriction, not a scoping choice) -- this is why a genuinely separate credential is
          # required, not just a wider default-token permission.
          BOT_TOKEN: ${{ secrets.REVIEW_EVIDENCE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f review-evidence-verdict.json ]; then
            echo "no-op: no verdict artifact was produced for this run (PR was not sensitive) -- nothing to post"
            exit 0
          fi

          verdict=$(python3 -c 'import json; print(json.load(open("review-evidence-verdict.json")).get("verdict", ""))')
          artifact_pr=$(python3 -c 'import json; print(json.load(open("review-evidence-verdict.json")).get("pr_number", ""))')

          if [ "$artifact_pr" != "$PR_NUMBER" ]; then
            echo "no-op: verdict artifact's pr_number ($artifact_pr) does not match this run's own PR ($PR_NUMBER) -- refusing to act on it" >&2
            exit 0
          fi

          if [ "$verdict" != "approve" ]; then
            echo "no-op: verdict is '$verdict', not 'approve' -- nothing to post"
            exit 0
          fi

          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "warning: REVIEW_EVIDENCE_BOT_TOKEN is not configured -- cannot post an APPROVED review under a bot identity. Provision this secret before Phase 1's live smoke test (design doc, Rollout Phase 0)." >&2
            exit 0
          fi

          GH_TOKEN="$BOT_TOKEN" gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            --body "Automated review evidence: this PR's sensitive-path change was classified by review-evidence-analyze. See the workflow run for details."
