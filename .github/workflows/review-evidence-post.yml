# F1 review-evidence gate (Track B). Design doc:
# docs/superpowers/specs/2026-09-24-f1-review-evidence-gate-design.md
#
# `review-evidence-post` -- write-only, the only job in this whole mechanism holding
# `pull-requests: write`; independently re-derives the review-evidence verdict itself (see below)
# and posts an APPROVED review under a bot identity only when that verdict says so.
#
# This is a separate file from `review-evidence.yml` (which holds `review-evidence-check` and
# `check-sensitive-path-bypass`) purely because GitHub Actions rejects a `workflow_run` trigger
# that watches its own workflow's completion outright: "Workflow 'Review Evidence' cannot listen
# to itself" (HTTP 422 from `gh workflow run`/the Actions API, verified against
# `review-evidence.yml` while authoring this change -- a self-referencing `workflow_run` trigger
# doesn't just skip that one job, it invalidates the *entire* file, so nothing in it runs at all).
# A `workflow_run` trigger can only watch a genuinely different workflow file, which is the only
# reason this job lives here instead of alongside `review-evidence-check`.
#
# Trust boundary -- why this job computes its own verdict instead of consuming one from another
# job (LENS-A-1, PR #298 remediation): a round-1 Phase 0 revision of this mechanism had a third,
# `pull_request`-triggered job (`review-evidence-analyze`, in review-evidence.yml) do the
# classification and write a verdict artifact for this job to trust. That was a real
# trust-boundary bypass: for a plain `pull_request`-triggered job, GitHub Actions resolves that
# job's *step definitions* -- not just the ref a checkout step inside it happens to request --
# from the PR's own head/merge ref, not the base branch. A same-repo PR author (no fork needed)
# could therefore edit `review-evidence-analyze`'s steps in the very PR being evaluated (e.g.
# replace "classify and write a verdict" with a one-liner that writes
# `{"verdict":"approve","pr_number":<n>}` directly) and have that forged step run instead of the
# real one -- and the old `review-evidence-post` only checked (a) the analyze run's conclusion was
# "success" (trivially true for a forged step that exits 0) and (b) the artifact's self-reported
# `pr_number` matched (an attacker-controlled job can compute that check over its own forged
# content just as easily). Net effect: a real, bot-issued APPROVED review, forgeable with zero
# actual review, for exactly the actor class (autonomous same-repo Builder PRs touching sensitive
# paths) this mechanism exists to check.
#
# Fix: `review-evidence-analyze` is gone. This job, triggered by `workflow_run`, has its OWN step
# definitions always resolved by GitHub from the repository's default branch (never a PR ref) --
# and its default (unpinned) `actions/checkout` ref is likewise always the tip of the default
# branch under `workflow_run` (`GITHUB_SHA` is set that way for this event specifically), never a
# PR's ref. So this job now re-runs `scripts/check_review_evidence.py analyze`'s classification
# logic itself, against that base-pinned checkout and its own `gh pr diff` fetch (using the
# trusted token below) -- it never reads, downloads, or otherwise trusts anything a
# `pull_request`-triggered job computed. A PR can no longer influence its own verdict by editing
# workflow steps, because no step whose definition it can influence ever computes the verdict.
#
# Re-verifying the original attack against this fix, line by line: (1) the PR author edits this
# repo's workflow files in their own PR -- there is no `review-evidence-analyze` job left to
# replace, and editing *this* file (review-evidence-post.yml) has no effect, because
# `workflow_run` always executes the version of this file that exists on the default branch, not
# whatever the PR branch contains; (2) the PR author instead tries editing
# `scripts/check_review_evidence.py` itself in their PR, hoping this job will `pip install`/run
# their edited copy -- it won't, because this job's checkout has no `ref:` override and therefore
# checks out `GITHUB_SHA`, which under `workflow_run` is the default branch's tip, not the PR's
# ref; the script that runs here is always main's trusted copy; (3) the PR author tries influencing
# the verdict via the diff content itself (Phase 0 has no real review pass yet -- `build_verdict`
# always returns `"block"` for a sensitive PR, so there is no "approve" path to manipulate at all
# today; once a real review pass is chosen, the diff is still only ever consumed as inert text via
# `gh pr diff`, per docs/skill-framework/shared/prompt-injection.md, not executed); (4) the PR
# author tries to make the `PR_NUMBER` this job acts on resolve to some other PR -- it can't,
# because `PR_NUMBER` is read from `github.event.workflow_run.pull_requests[0].number`, a value
# GitHub itself attaches to the trigger event, never anything read from analyzed diff content or a
# PR body. No step in the path that decides "approve or not" is ever resolved from, or reads
# unvalidated data supplied by, the PR under evaluation.
name: Review Evidence Post

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] this job never checks out the PR ref and only
    # ever acts on values GitHub itself attaches to the workflow_run event (run id,
    # pull_requests[0].number, head_repository.full_name) to decide *whose* PR to re-analyze and
    # whether to post at all -- the actual verdict is recomputed independently below from a
    # base-pinned checkout and the GitHub API, never from anything read out of the analyzed diff
    # or PR body. See the job's own step comments and this file's header for the full reasoning;
    # this is the "safe" workflow_run shape zizmor's audit-confidence is explicitly Medium about,
    # not the "checks out and executes untrusted PR code with a privileged token" shape the audit
    # exists to catch.
    workflows: ["Review Evidence"]
    types: [completed]

permissions:
  contents: read

# Deliberately the identical group-name formula review-evidence.yml uses (concurrency groups are
# repository-wide, not scoped per workflow file): a new push's fresh review-evidence-check run
# supersedes a still-in-flight attempt here to approve the now-stale prior head, rather than
# racing it (design doc, APIs table and Retries & idempotency).
concurrency:
  group: "review-evidence-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id || github.run_id }}"
  cancel-in-progress: true

jobs:
  review-evidence-post:
    name: review-evidence-post
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` override, deliberately -- under the `workflow_run` event, GitHub Actions
          # sets the default checkout ref (`GITHUB_SHA`) to the tip of the repository's *default*
          # branch, never the triggering PR's ref. This is the trusted, base-pinned copy of
          # scripts/check_review_evidence.py and docs/sensitive-paths.yaml this job's own
          # classification step below runs -- a PR can never change what evaluates it by editing
          # its own copy of either (same property review-evidence-check's own base-pinned checkout
          # already has; see that job's comment in review-evidence.yml). See this file's header
          # comment for the full trust-boundary reasoning.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Independently classify and write a verdict artifact
        # This job's own, trusted recomputation -- it never reads anything a `pull_request`-
        # triggered job produced (there is no such job left in this mechanism at all; see header).
        # PR_NUMBER comes from the workflow_run trigger event's own PR association (GitHub-
        # attached, not attacker-influenceable -- design doc, Components table and Failure-
        # strategy table), never from analyzed diff content or a PR body.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ ! -f scripts/check_review_evidence.py ]; then
            echo "scripts/check_review_evidence.py does not exist at this base commit -- the review-evidence gate has not been adopted here yet; nothing to enforce, exiting cleanly"
            exit 0
          fi
          python3 scripts/check_review_evidence.py analyze --repo "$REPO" --pr "$PR_NUMBER" \
            --out review-evidence-verdict.json

      - name: Post review evidence if the verdict approves
        env:
          REPO: ${{ github.repository }}
          # The trigger event's own PR association, never a value derived from the analyzed diff
          # or PR body (design doc, Components table and Failure-strategy table).
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          # Provisioned separately (Phase 0 rollout step, not part of this change): a PAT or
          # GitHub App install scoped to `pull-requests: write` only. The default GITHUB_TOKEN's
          # Actions-bot identity cannot post an APPROVED review on GitHub at all (a platform
          # restriction, not a scoping choice) -- this is why a genuinely separate credential is
          # required, not just a wider default-token permission.
          BOT_TOKEN: ${{ secrets.REVIEW_EVIDENCE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f review-evidence-verdict.json ]; then
            echo "no-op: no verdict artifact was produced for this run (PR was not sensitive) -- nothing to post"
            exit 0
          fi

          verdict=$(python3 -c 'import json; print(json.load(open("review-evidence-verdict.json")).get("verdict", ""))')
          artifact_pr=$(python3 -c 'import json; print(json.load(open("review-evidence-verdict.json")).get("pr_number", ""))')

          if [ "$artifact_pr" != "$PR_NUMBER" ]; then
            echo "no-op: verdict artifact's pr_number ($artifact_pr) does not match this run's own PR ($PR_NUMBER) -- refusing to act on it" >&2
            exit 0
          fi

          if [ "$verdict" != "approve" ]; then
            echo "no-op: verdict is '$verdict', not 'approve' -- nothing to post"
            exit 0
          fi

          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "warning: REVIEW_EVIDENCE_BOT_TOKEN is not configured -- cannot post an APPROVED review under a bot identity. Provision this secret before Phase 1's live smoke test (design doc, Rollout Phase 0)." >&2
            exit 0
          fi

          GH_TOKEN="$BOT_TOKEN" gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            --body "Automated review evidence: this PR's sensitive-path change was independently classified by review-evidence-post against a base-branch-pinned checkout. See the workflow run for details."
