name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Catch drift (a newly-broken external link, a dependency CVE advisory, etc.) even when no PR
    # is open against main.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Batch 5 prompt-diff risk classification compares the PR base/head.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
          python3 -m pip install --require-hashes -r requirements.lock

      - name: Validate operational upkeep policy
        run: |
          python3 scripts/operational_upkeep.py validate
          python3 -m scripts.deprecation_lifecycle

      - name: Publish prompt-system health, eval tiers and provenance
        run: |
          python3 scripts/operational_upkeep.py health --format markdown --revision "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/eval_tier_health.py --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce prompt-diff risk and removal lifecycle
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/deprecation_diff_guard.py --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/operational_upkeep.py classify-diff --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: make lint
        env:
          # zizmor's online audits (e.g. artipacked) need API access to check upstream
          # Actions' tag history; the default token has enough scope for that read.
          GH_TOKEN: ${{ github.token }}
        run: make lint

  install-macos:
    # macOS ships bash 3.2 (last GPLv2 release) as /bin/bash and scripts/install.sh runs under
    # that, not whatever bash `brew install bash` might add — the ubuntu-latest `lint` job above
    # only ever exercises bash 5.x, so a bash-4+-only builtin (e.g. mapfile) here previously
    # went undetected until a real macOS user hit it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Verify install script under macOS's default bash
        run: make verify-install verify-install-all
