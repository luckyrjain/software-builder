name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Catch drift (a newly-broken external link, a dependency CVE advisory, etc.) even when no PR
    # is open against main.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Split from a single serial `make lint` job: lint-static is every grep/structural
  # check plus the registry validators and verify-install-all (no pytest; the install
  # sweep, not the structural checks, dominates its runtime) and lint-suites is every
  # pytest-bearing target -- dominated by scripts/tests/'s ~2000 tests, parallelized
  # with pytest-xdist (see PYTEST_XDIST_FLAG in make/core.mk). Running them as separate
  # jobs means a structural error surfaces fast instead of waiting behind the test
  # suites, and the two workloads no longer share one runner's single core.
  lint-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Batch 5 prompt-diff risk classification compares the PR base/head.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
          python3 -m pip install --require-hashes -r requirements.lock

      # operational_upkeep.py validate / deprecation_lifecycle / eval_tier_health
      # enforcement all live in `make lint-static`'s validate-operational-upkeep
      # target below (also the locally-reproducible entry point, and early
      # enough in the prerequisite chain to fail fast before the per-skill lint
      # targets run), so this step only publishes.
      - name: Publish prompt-system health
        run: |
          python3 scripts/operational_upkeep.py health --format markdown --revision "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce prompt-diff risk and removal lifecycle
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/deprecation_diff_guard.py --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/operational_upkeep.py classify-diff --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: make lint-static
        env:
          # zizmor's online audits (e.g. artipacked) need API access to check upstream
          # Actions' tag history; the default token has enough scope for that read.
          GH_TOKEN: ${{ github.token }}
        run: make lint-static

  lint-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
          python3 -m pip install --require-hashes -r requirements.lock

      - name: make lint-suites
        # --output-sync=target keeps each target's output contiguous instead of interleaving
        # lines from ~19 concurrent lint-* recipes, which otherwise makes a failure's log
        # unreadable. PYTEST_XDIST_WORKERS caps scripts/tests/'s own xdist worker pool
        # (normally "-n auto", i.e. one per core) so it doesn't claim every core while ~18
        # sibling lint-suites targets are also mid-flight under this same `make -j"$(nproc)"`
        # -- the oversubscription class make/core.mk's PYTEST_XDIST_FLAG comment documents,
        # previously the source of sporadic broken-pipe/flaky dangling-link failures.
        run: make -j"$(nproc)" --output-sync=target lint-suites
        env:
          PYTEST_XDIST_WORKERS: "2"

  install-macos:
    # macOS ships bash 3.2 (last GPLv2 release) as /bin/bash and scripts/install.sh runs under
    # that, not whatever bash `brew install bash` might add — the ubuntu-latest `lint` job above
    # only ever exercises bash 5.x, so a bash-4+-only builtin (e.g. mapfile) here previously
    # went undetected until a real macOS user hit it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.lock

      - name: Verify install script under macOS's default bash
        run: make verify-install verify-install-all

  install-engine-windows:
    # The install engine has Windows-specific branches (is_pid_alive via ctypes, SIGBREAK as the
    # terminate signal, directory-rename semantics) that ubuntu and macOS never execute. `sb` is
    # the Windows install path, so its snapshot build and CLI suites run here too. install.sh is
    # exercised under Git Bash (the README supports it natively on macOS, Linux and WSL; this is
    # the closest thing to a Windows-native run and catches path/CRLF/python3-lookup problems).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install engine tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          scripts/tests/test_install_engine_cli.py
          scripts/tests/test_install_engine_install.py
          scripts/tests/test_install_engine_locking.py
          scripts/tests/test_install_engine_uninstall.py
          scripts/tests/test_install_engine_lock_hardening.py
          scripts/tests/test_registry_root_lock.py

      - name: sb snapshot build tests
        run: python -m pytest -q -p no:cacheprovider scripts/tests/test_build_sb_snapshot.py

      - name: sb CLI tests
        working-directory: cli
        run: python -m pytest -q -p no:cacheprovider tests

      - name: install.sh under Git Bash
        shell: bash
        run: |
          # install.sh calls `python3`; make sure one resolves to the interpreter setup-python
          # installed rather than assuming the runner image provides it.
          if ! command -v python3 >/dev/null 2>&1; then
            py_dir="$(dirname "$(command -v python)")"
            cp "${py_dir}/python.exe" "${py_dir}/python3.exe"
          fi
          python -m pytest -q -p no:cacheprovider \
            scripts/tests/test_install_legacy_golden.py \
            scripts/tests/test_install_rollback.py \
            scripts/tests/test_install_safety.py
