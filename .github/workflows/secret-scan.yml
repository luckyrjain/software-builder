name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Catch a secret that lands via a path this workflow's own triggers don't cover (e.g. a
    # direct push to a branch outside main/master that later merges without a fresh PR event).
    - cron: "41 6 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No-op for this repo today (an individual-account-owned repo skips the license check
          # entirely) but load-bearing the moment this repo is forked or transferred into an
          # organization: gitleaks-action v3 hard-exits before scanning if the repo owner's
          # GitHub account type is "Organization" and this is unset — see
          # docs/REPOSITORY.md's "Security workflows" section.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  negative-test:
    # Proves the scanner itself still fires, independent of whether this run's actual repo
    # content is clean. The fixture is generated at run-time and scanned in isolation — never
    # committed to git history — to avoid ever storing a secret-shaped string permanently in
    # the repository (native GitHub push protection's enabled/disabled state for this repo is
    # unverified, see docs/REPOSITORY.md's "Security workflows" section, so a committed fixture
    # risked either an unexpected blocked push or a false-positive alert with no upside over
    # this approach).
    runs-on: ubuntu-latest
    steps:
      - name: Generate a known-bad fixture and confirm the scanner catches it
        run: |
          fixture_dir="$(mktemp -d)"
          report_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir" "$report_dir"' EXIT
          # A random AWS-access-key-ID-shaped string (AKIA + 16 chars from gitleaks' own
          # aws-access-token regex's [A-Z2-7] class), generated fresh every run — NOT AWS's
          # well-known AKIAIOSFODNN7EXAMPLE placeholder, which gitleaks' own default config
          # now allowlists (`.+EXAMPLE$` on the aws-access-token rule) precisely because it's
          # so widely recognized as a non-functional example; using it here would make this
          # negative test pass even if real-leak detection were broken. A freshly-randomized,
          # never-published string can't be pre-allowlisted the same way, and — because it's
          # never committed to git, only scanned in an isolated temp dir — carries none of the
          # risk a committed fixture would (see above).
          # A "generator | head -c N" pipeline SIGPIPEs the generator once head has read
          # enough — under bash's default `-eo pipefail` (what GitHub Actions runs each step
          # with), pipefail surfaces that as the pipeline's exit status even though head itself
          # succeeded, so `set -e` aborts here on every run. Loop over bounded reads instead:
          # each `head -c 64 /dev/urandom` reads a fixed amount from a device file (not a piped
          # generator process), so it always completes normally with no signal involved.
          suffix=""
          while [ "${#suffix}" -lt 16 ]; do
            suffix="${suffix}$(head -c 64 /dev/urandom | LC_ALL=C tr -dc 'A-Z2-7')"
          done
          suffix="${suffix:0:16}"
          printf 'AWS_ACCESS_KEY_ID=AKIA%s\n' "$suffix" > "$fixture_dir/fake-credentials.env"
          set +e
          # Pinned by digest, not the mutable `v8.30.1` tag — a Docker tag can be silently
          # repointed after review the same way a mutable git ref can, which is exactly the
          # risk lint-actions-pinning enforces for every `uses:` reference elsewhere in this
          # repo's workflows (a `docker run` image reference isn't a `uses:` field, so that
          # check can't cover it — pin it here directly instead). Digest resolved from the
          # `v8.30.1` manifest at the time this was written; bump both together when updating.
          # Exit code 1 alone doesn't distinguish "leak detected" from "the scan itself hit an
          # error" — gitleaks' own findingSummaryAndExit (cmd/root.go) calls os.Exit(1) on a
          # non-nil scan error BEFORE it ever reaches the findings-count exit branch, so a
          # partial-scan failure would report the same exit code as a real detection and this
          # negative test would falsely report success. Write the report to a file and check
          # for an actual finding instead of trusting the exit code alone.
          docker run --rm -v "$fixture_dir:/scan:ro" -v "$report_dir:/report" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --no-git --source /scan --report-path /report/findings.json --exit-code 1
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "error: secret scanner exited $status (expected 1) — detection is broken" >&2
            exit 1
          fi
          if ! grep -q '"RuleID"' "$report_dir/findings.json" 2>/dev/null; then
            echo "error: secret scanner exited 1 but its report contains no finding — the exit code alone was ambiguous (could be a scan error, not a detection) and no leak was actually recorded — detection is broken" >&2
            exit 1
          fi
          echo "ok: secret scanner correctly detected the known-bad fixture"
