name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Catch a secret that lands via a path this workflow's own triggers don't cover (e.g. a
    # direct push to a branch outside main/master that later merges without a fresh PR event).
    - cron: "41 6 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  negative-test:
    # Proves the scanner itself still fires, independent of whether this run's actual repo
    # content is clean. The fixture is generated at run-time and scanned in isolation — never
    # committed to git history — to avoid ever storing a secret-shaped string permanently in
    # the repository (native GitHub push protection's enabled/disabled state for this repo is
    # unverified, see docs/security-workflows.md, so a committed fixture risked either an
    # unexpected blocked push or a false-positive alert with no upside over this approach).
    runs-on: ubuntu-latest
    steps:
      - name: Generate a known-bad fixture and confirm the scanner catches it
        run: |
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          # AWS's own canonical placeholder access key ID — documented throughout AWS's own
          # docs as a non-functional example, chosen specifically so this never risks looking
          # like (or being mistaken for) a real leaked credential.
          printf 'AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE\n' > "$fixture_dir/fake-credentials.env"
          set +e
          docker run --rm -v "$fixture_dir:/scan" zricethezav/gitleaks:v8.9.0 \
            detect --no-git --source /scan --exit-code 1
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "error: secret scanner did not detect the known-bad fixture (exit $status) — detection is broken" >&2
            exit 1
          fi
          echo "ok: secret scanner correctly detected the known-bad fixture"
