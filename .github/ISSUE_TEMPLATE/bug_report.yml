name: Bug report
description: Something in an existing skill or the shared framework behaves incorrectly.
labels: ["bug"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Affected skill
      description: Which skill (or shared framework file) does this concern?
      options:
        # GENERATED from skills.yaml — run make generate
        - api-design-review
        - api-test-creator
        - architecture-review
        - backlog-runner
        - capacity-planner
        - change-impact-analyzer
        - contract-test-creator
        - cost-optimization-sprint-planner
        - database-review
        - dependency-upgrade-review
        - deployment-risk-review
        - domain-comprehension
        - e2e-test-creator
        - implementation-planner
        - incident-rca
        - incident-triage-agent
        - integration-test-creator
        - k8s-overprovisioning-datadog
        - loop-task-implementer
        - migration-program-manager
        - mysql-to-postgres-sql
        - new-hire-guide
        - observability-review
        - performance-review
        - pr-gatekeeper
        - pr-review
        - prd-architect
        - production-readiness-review
        - release-readiness-checker
        - resilience-review
        - security-review
        - squad-map
        - system-design
        - tech-debt-assessor
        - test-writer
        - unit-test-creator
        - weekly-squad-digest
        - who-owns-x-bot
        - docs/skill-framework (shared framework)
        - Makefile / scripts / installer
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened, per the skill's own documented workflow/reference files?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Paste the relevant agent output if you have it.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The exact invocation/input that triggers this, and your host (Cursor, Claude Code, Codex, Kiro, other).
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I confirmed this isn't a security issue (if it is, use "Report a security vulnerability" instead)
          required: true
